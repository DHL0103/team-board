<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · 승인 요청</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: back-header}"></div>

    <div class="admin-wrap">

        <nav class="admin-nav">
            <a href="/admin/request" class="admin-nav-item active">승인 요청</a>
            <a href="/admin/members" class="admin-nav-item">멤버 관리</a>
            <a href="/admin/boards" class="admin-nav-item">보드 관리</a>
        </nav>

        <!-- 승인 요청 섹션 -->
        <div class="admin-section">
            <div class="admin-section-header">
                <div>
                    <div class="admin-section-title">승인 요청 목록</div>
                    <div class="admin-section-meta">REQUESTED 상태의 작업을 승인하거나 반려할 수 있습니다.</div>
                </div>
            </div>

            <!-- 빈 상태 -->
            <div class="admin-empty" th:if="${#lists.isEmpty(postList)}">
                승인 대기 중인 작업이 없습니다.
            </div>

            <div class="request-list" th:unless="${#lists.isEmpty(postList)}">
                <div class="request-card"
                     th:each="post : ${postList}"
                     th:with="palette=${boardPaletteMap[post.boardId]}"
                     th:classappend="${'palette-' + palette}">
                    <a class="request-card-info" th:href="@{'/post/' + ${post.id}}">
                        <div class="request-card-title" th:text="${post.title}">작업 제목</div>
                        <div class="request-card-meta">
                            <span th:text="${#temporals.format(post.createdAt, 'MM.dd 등록')}">01.01 등록</span>
                            <span class="due-chip"
                                  th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                                <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
                                    <rect x="1" y="1.5" width="8" height="7.5" rx="1" />
                                    <path d="M3 1v1M7 1v1M1 4h8" />
                                </svg>
                                <span class="due-label"
                                      th:text="${post.dueDate != null ? #temporals.format(post.dueDate,'MM.dd') : '기한 없음'}"></span>
                            </span>
                        </div>
                    </a>
                    <div class="request-card-actions">
                        <form th:action="@{'/admin/approve/' + ${post.id}}" method="post" style="display:inline;">
                            <button type="submit" class="btn-approve">승인</button>
                        </form>
                        <button type="button" class="btn-reject"
                                th:data-post-id="${post.id}"
                                onclick="openRejectModal(this)">반려</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 반려 사유 모달 -->
    <div class="modal-overlay" id="rejectModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">반려 사유 입력</span>
                <button class="modal-close" onclick="closeRejectModal()">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                        <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <form id="rejectForm" method="post">
                <div class="form-group">
                    <label class="form-label">사유</label>
                    <textarea class="form-input" name="reason" placeholder="반려 사유를 입력하세요" required></textarea>
                </div>
                <button type="submit" class="btn-submit" style="background:#e11d48;">반려 확정</button>
            </form>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        function openRejectModal(btn) {
            const postId = btn.dataset.postId;
            document.getElementById('rejectForm').action = '/admin/reject/' + postId;
            document.getElementById('rejectModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeRejectModal() {
            document.getElementById('rejectModal').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.getElementById('rejectModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('rejectModal')) closeRejectModal();
        });
    </script>

</body>

</html>
