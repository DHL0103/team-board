<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · 보드 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header>
        <a href="/board" class="logo">
            <div class="logo-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
                    <rect x="1" y="1" width="6" height="6" rx="1" />
                    <rect x="9" y="1" width="6" height="6" rx="1" />
                    <rect x="1" y="9" width="6" height="6" rx="1" />
                    <rect x="9" y="9" width="6" height="6" rx="1" />
                </svg>
            </div>
            Team Board
        </a>
        <a href="/board" class="btn-back">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M7.5 2L3 6l4.5 4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            보드로 돌아가기
        </a>
    </header>

    <div class="admin-wrap">

        <nav class="admin-nav">
            <a href="/admin/request" class="admin-nav-item">승인 요청</a>
            <a href="/admin/members" class="admin-nav-item">멤버 관리</a>
            <a href="/admin/boards" class="admin-nav-item active">보드 관리</a>
        </nav>

        <!-- 보드 목록 섹션 -->
        <div class="admin-section">
            <div class="admin-section-header">
                <div>
                    <div class="admin-section-title">보드 목록</div>
                    <div class="admin-section-meta">보드를 추가하거나 수정/삭제할 수 있습니다.</div>
                </div>
                <button class="btn-admin-primary" id="btn-open-create">
                    <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    보드 추가
                </button>
            </div>

            <div class="admin-empty" th:if="${#lists.isEmpty(boardList)}">
                등록된 보드가 없습니다.
            </div>

            <table class="admin-table" th:unless="${#lists.isEmpty(boardList)}">
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>슬러그</th>
                        <th>설명</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="board : ${boardList}">
                        <td th:text="${board.name}">보드명</td>
                        <td th:text="${board.slug}" style="color: var(--text-muted); font-size: 12px;">slug</td>
                        <td th:text="${board.description != null ? board.description : '-'}" style="color: var(--text-sub);">설명</td>
                        <td>
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-admin-edit btn-open-edit"
                                        th:data-board-id="${board.id}"
                                        th:data-board-name="${board.name}"
                                        th:data-board-slug="${board.slug}"
                                        th:data-board-desc="${board.description}">
                                    수정
                                </button>
                                <form th:action="@{'/admin/board/delete/' + ${board.id}}" method="post"
                                      onsubmit="return confirm('보드를 삭제하면 소속 작업도 모두 삭제됩니다. 계속할까요?')">
                                    <button type="submit" class="btn-admin-danger">삭제</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- 보드 생성 모달 -->
    <div class="modal-overlay" id="createBoardModal">
        <div class="modal-box modal-box--admin">
            <div class="modal-title">보드 추가</div>

            <form action="/admin/board/create" method="post">
                <div class="form-group">
                    <label>이름</label>
                    <input class="input-field" type="text" name="name" placeholder="보드 이름 (예: Backend팀)" required>
                </div>
                <div class="form-group">
                    <label>슬러그</label>
                    <input class="input-field" type="text" name="slug" placeholder="URL용 이름 (예: backend)">
                </div>
                <div class="form-group">
                    <label>설명 <span style="color: var(--text-muted); font-weight: 400;">(선택)</span></label>
                    <input class="input-field" type="text" name="description" placeholder="보드 설명">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="btn-close-create">취소</button>
                    <button type="submit" class="btn-modal-confirm">추가</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 보드 수정 모달 -->
    <div class="modal-overlay" id="editBoardModal">
        <div class="modal-box modal-box--admin">
            <div class="modal-title">보드 수정</div>

            <form id="editBoardForm" action="/admin/board/update/0" method="post">
                <div class="form-group">
                    <label>이름</label>
                    <input class="input-field" type="text" name="name" id="edit-board-name" required>
                </div>
                <div class="form-group">
                    <label>슬러그</label>
                    <input class="input-field" type="text" name="slug" id="edit-board-slug">
                </div>
                <div class="form-group">
                    <label>설명 <span style="color: var(--text-muted); font-weight: 400;">(선택)</span></label>
                    <input class="input-field" type="text" name="description" id="edit-board-desc">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="btn-close-edit">취소</button>
                    <button type="submit" class="btn-modal-confirm">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>

</body>

</html>
