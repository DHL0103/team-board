<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Admin · 보드 관리</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: header('back')}"></div>

  <div class="admin-wrap">

    <div th:replace="~{fragments/admin-nav :: admin-nav('boards')}"></div>

    <div class="admin-section">
      <div class="admin-section-header">
        <div>
          <div class="admin-section-title">보드 목록</div>
          <div class="admin-section-meta" th:text="${#lists.size(boardResponseDtoList)} + '개'"></div>
        </div>
        <input type="text" id="board-search" class="form-input" placeholder="보드 이름 검색" style="max-width:200px;">
      </div>

      <div class="admin-empty" th:if="${#lists.isEmpty(boardResponseDtoList)}">
        등록된 보드가 없습니다.
      </div>

      <div class="table-scroll-wrap">
      <table class="admin-table" th:unless="${#lists.isEmpty(boardResponseDtoList)}">
        <thead>
          <tr>
            <th style="width:40px;"></th>
            <th>이름</th>
            <th>설명</th>
            <th style="width:80px;">멤버</th>
            <th style="width:90px; text-align:center;">상태</th>
          </tr>
        </thead>
        <tbody id="board-tbody">
          <tr class="admin-table-row"
              th:each="board : ${boardResponseDtoList}"
              th:data-name="${board.name}"
              th:data-board-id="${board.id}">
            <td>
              <span class="board-color-dot" th:classappend="'dot-' + ${board.color}"></span>
            </td>
            <td>
              <a th:href="@{'/board/' + ${board.id}}" class="admin-board-link" th:text="${board.name}"></a>
            </td>
            <td style="color:var(--text-sub); max-width:300px; font-size:12px; word-break:break-word;"
                th:text="${board.description != null ? board.description : '-'}"></td>
            <td th:text="${board.memberCount}"></td>
            <td style="text-align:center;">
              <span th:if="${board.status == 'ACTIVE'}"
                    class="status-badge status-active status-badge--toggle"
                    th:data-board-id="${board.id}"
                    data-current-status="ACTIVE">활성</span>
              <span th:unless="${board.status == 'ACTIVE'}"
                    class="status-badge status-inactive status-badge--toggle"
                    th:data-board-id="${board.id}"
                    data-current-status="INACTIVE">비활성</span>
            </td>
          </tr>
        </tbody>
      </table>
      </div>

      <div class="pagination-wrap" id="pagination-wrap"></div>
    </div>

  </div>

  <!-- 상태 변경 확인 모달 -->
  <div class="modal-overlay" id="statusChangeModal">
    <div class="modal-box">
      <div class="modal-box-title" id="statusChangeTitle">상태 변경</div>
      <p class="modal-box-desc" id="statusChangeDesc"></p>
      <div class="modal-box-actions">
        <button class="btn btn-secondary" id="statusChangeCancel">취소</button>
        <button class="btn btn-primary" id="statusChangeConfirm">확인</button>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/scripts :: common-scripts}"></th:block>
  <script th:src="@{/js/components/Pagination.js}"></script>
  <script th:src="@{/js/admin/AdminBoardsPage.js}"></script>

</body>

</html>
