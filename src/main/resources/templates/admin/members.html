<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Admin · 멤버 관리</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <div class="admin-wrap">

    <nav class="admin-nav">
      <a href="/admin/members" class="admin-nav-item active">멤버 관리</a>
      <a href="/admin/boards" class="admin-nav-item">보드 관리</a>
    </nav>

    <div class="admin-section">
      <div class="admin-section-header">
        <div>
          <div class="admin-section-title">멤버 목록</div>
          <div class="admin-section-meta" th:text="${#lists.size(members)} + '명'"></div>
        </div>
        <input type="text" id="member-search" class="form-input" placeholder="아이디 검색" style="max-width:200px;">
      </div>

      <div class="admin-empty" th:if="${#lists.isEmpty(members)}">
        등록된 멤버가 없습니다.
      </div>

      <table class="admin-table" th:unless="${#lists.isEmpty(members)}">
        <thead>
          <tr>
            <th style="width:60px;">#</th>
            <th>아이디</th>
            <th style="width:110px;">권한</th>
          </tr>
        </thead>
        <tbody id="member-tbody">
          <tr class="admin-table-row"
              th:each="member : ${members}"
              th:data-member-id="${member.id}"
              th:data-username="${member.username}"
              th:data-role="${member.role}">
            <td th:text="${member.id}"></td>
            <td th:text="${member.username}"></td>
            <td>
              <span th:if="${member.role.name() == 'ROLE_ADMIN'}" class="role-badge role-admin">Admin</span>
              <span th:if="${member.role.name() == 'ROLE_USER'}" class="role-badge role-user role-badge--toggle" title="클릭하여 정지">User</span>
              <span th:if="${member.role.name() == 'ROLE_SUSPENDED'}" class="role-badge role-suspended role-badge--toggle" title="클릭하여 복구">정지</span>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-wrap" id="pagination-wrap"></div>
    </div>

  </div>

  <div class="modal-overlay" id="roleChangeModal">
    <div class="modal-box modal-box--admin">
      <div class="modal-title" id="role-change-title"></div>
      <div class="modal-desc" id="role-change-desc"></div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="button" class="btn-modal-cancel" id="btn-role-change-cancel">취소</button>
        <button type="button" class="btn-modal-confirm" id="btn-role-change-confirm">확인</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="memberDetailModal">
    <div class="modal-box modal-box--admin">
      <div class="modal-title" id="modal-member-username"></div>
      <div id="modal-board-list">
        <div class="admin-empty">소속 보드가 없습니다.</div>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="button" class="btn-admin-edit" id="btn-close-member-detail">닫기</button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/admin_members.js}"></script>

</body>

</html>
