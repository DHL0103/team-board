<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Admin · 멤버 관리</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: header('back')}"></div>

  <div class="admin-wrap">

    <div th:replace="~{fragments/admin-nav :: admin-nav('members')}"></div>

    <div class="admin-section">
      <div class="admin-section-header">
        <div>
          <div class="admin-section-title">멤버 목록</div>
          <div class="admin-section-meta" id="member-count-meta">-</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn-admin-edit filter-btn active" id="btn-filter-active">활성</button>
          <button type="button" class="btn-admin-edit filter-btn" id="btn-filter-suspended">정지</button>
          <input type="text" id="member-search" class="form-input" placeholder="아이디 검색" style="max-width:200px;">
        </div>
      </div>

      <div class="admin-empty" id="member-empty" style="display:none;">
        등록된 멤버가 없습니다.
      </div>

      <table class="admin-table" id="member-table">
        <thead>
          <tr>
            <th style="width:60px;">#</th>
            <th>아이디</th>
            <th style="width:110px;">권한</th>
          </tr>
        </thead>
        <tbody id="member-tbody"></tbody>
      </table>

      <div class="pagination-wrap" id="pagination-wrap"></div>
    </div>

  </div>

  <div class="modal-overlay" id="memberDetailModal">
    <div class="modal-box modal-box--admin">
      <div class="modal-title" id="modal-member-username"></div>
      <div id="modal-board-list">
        <div class="admin-empty">소속 보드가 없습니다.</div>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="button" class="btn-admin-edit" id="btn-close-member-detail">닫기</button>
        <button type="button" id="btn-member-role-action" style="display:none;"></button>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/scripts :: common-scripts}"></th:block>
  <script th:src="@{/js/components/Pagination.js}"></script>
  <script th:src="@{/js/admin/AdminMembersPage.js}"></script>

</body>

</html>
