<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>마이페이지 · Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

<div th:replace="~{fragments/header :: back-header}"></div>

<div class="mypage-wrap">

  <!-- 왼쪽: 내 정보 -->
  <div class="mypage-profile">
    <div class="mypage-profile-header">
      <div class="profile-label">내 계정</div>
      <div class="profile-username" th:text="${username}">username</div>
    </div>
    <div class="mypage-profile-body">
      <div class="section-title">비밀번호 변경</div>

      <form th:action="@{/member/mypage/password}" th:object="${passwordChangeDto}" method="post">

        <div class="mypage-form-group">
          <label for="currentPassword">현재 비밀번호</label>
          <input class="mypage-input" th:classappend="${#fields.hasErrors('currentPassword')} ? 'input-error'"
                 type="password" th:field="*{currentPassword}" placeholder="현재 비밀번호">
          <span class="mypage-input-error-msg visible" th:if="${#fields.hasErrors('currentPassword')}"
                th:errors="*{currentPassword}"></span>
        </div>

        <div class="mypage-form-group">
          <label for="newPassword">새 비밀번호</label>
          <input class="mypage-input" th:classappend="${#fields.hasErrors('newPassword')} ? 'input-error'"
                 type="password" th:field="*{newPassword}" placeholder="4~20자">
          <span class="mypage-input-error-msg visible" th:if="${#fields.hasErrors('newPassword')}"
                th:errors="*{newPassword}"></span>
        </div>

        <div class="mypage-form-group">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="mypage-input" th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'input-error'"
                 type="password" th:field="*{newPasswordConfirm}" placeholder="새 비밀번호 재입력">
          <span class="mypage-input-error-msg visible" th:if="${#fields.hasErrors('newPasswordConfirm')}"
                th:errors="*{newPasswordConfirm}"></span>
        </div>

        <button type="submit" class="btn-change-password">비밀번호 변경</button>
      </form>
    </div>
  </div>

  <!-- 오른쪽: board 초대 목록 -->
  <div class="mypage-invites">
    <div class="mypage-section-header">
      <span class="section-title">받은 board 초대</span>
      <span class="section-count" th:text="${#lists.size(invitedBoards)} + '건'">0건</span>
    </div>

    <div class="invite-empty" th:if="${#lists.isEmpty(invitedBoards)}">
      받은 초대가 없습니다.
    </div>

    <div th:each="board : ${invitedBoards}">
      <div class="invite-card">
        <div class="invite-board-info">
          <span class="invite-board-dot" th:classappend="${'dot-' + board.boardColor}"></span>
          <span class="invite-board-name" th:text="${board.boardName}">보드명</span>
        </div>
        <div class="invite-actions">
          <form th:action="@{/member/mypage/boards/{id}/accept(id=${board.boardId})}" method="post" style="margin:0;">
            <button type="submit" class="btn-invite-accept">수락</button>
          </form>
          <form th:action="@{/member/mypage/boards/{id}/reject(id=${board.boardId})}" method="post" style="margin:0;">
            <button type="submit" class="btn-invite-reject">거절</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/mypage.js}"></script>
</body>

</html>
