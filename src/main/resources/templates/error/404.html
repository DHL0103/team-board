<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 페이지를 찾을 수 없음</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>
<body>
<div class="error-page">
  <div class="error-card">

    <div class="error-icon-wrap">
      <svg><use href="/img/icons.svg#icon-search-error"></use></svg>
    </div>

    <div class="error-code-row">
      <span class="error-code">404</span>
      <div class="error-divider"></div>
      <span class="error-type">Not Found</span>
    </div>

    <div class="error-title">존재하지 않는 게시물입니다</div>

    <div class="error-desc">
      삭제되었거나 없는 게시물입니다.<br>
      보드로 돌아가서 다른 작업을 확인해보세요.
    </div>

    <div class="error-actions">
      <a href="/boards" class="btn-new">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-home"></use></svg>
        보드로 돌아가기
      </a>
    </div>

    <div class="error-footer">
      문제가 계속되면 관리자에게 문의하세요
    </div>

  </div>
</div>
</body>
</html>
