<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title>Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

    <div class="toast" id="errorToast"
         th:text="${param.error != null ? (param.error[0] == 'fileSize' ? '파일 크기는 10MB를 초과할 수 없습니다.' : (param.error[0] == 'validation' ? '입력값이 올바르지 않습니다.' : '오류가 발생했습니다.')) : ''}">
    </div>

    <div th:replace="~{fragments/header :: header('main')}"></div>

    <div class="page-top">
        <div class="page-top-row">
            <div>
                <div class="page-title">내 보드</div>
                <div class="page-meta" id="board-count-label">총 0개의 보드</div>
            </div>
            <div class="board-search-wrap">
                <svg width="14" height="14"><use href="/img/icons.svg#icon-search"></use></svg>
                <input type="text" class="board-search-input" id="boardSearchInput" placeholder="보드 검색...">
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn-admin-edit filter-btn active" id="btn-board-filter-active">활성</button>
                <button type="button" class="btn-admin-edit filter-btn" id="btn-board-filter-inactive">비활성</button>
            </div>
        </div>
    </div>

    <div class="board-grid-wrap">
        <div class="board-grid">
            <div class="board-grid-card-create" id="btn-open-board-create">
                <div class="create-icon">
                    <svg width="20" height="20"><use href="/img/icons.svg#icon-plus"></use></svg>
                </div>
                <span>만들기</span>
            </div>
            <a class="board-grid-card"
               th:each="board : ${boardList}"
               th:href="@{'/board/' + ${board.id}}"
               th:classappend="${'palette-' + board.color}"
               th:data-status="${board.status}"
               >
                <div class="board-grid-card-bar"></div>
                <div class="board-grid-card-body">
                    <div class="board-grid-card-name" th:text="${board.name}">보드명</div>
                    <div class="board-grid-card-footer">
                        <span class="board-grid-member-count">
                            <svg width="11" height="11"><use href="/img/icons.svg#icon-user"></use></svg>
                            <span class="member-count-label" th:text="${board.memberCount}">-</span>
                        </span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- 보드 생성 모달 -->
    <div class="modal-overlay" id="createBoardModal">
        <div class="modal-box modal-box--admin">
            <div class="modal-header">
                <span class="modal-title">보드 추가</span>
                <button type="button" class="modal-close" id="btn-close-board-create">
                    <svg width="10" height="10"><use href="/img/icons.svg#icon-close"></use></svg>
                </button>
            </div>
            <form action="/board/create" method="post">
                <div class="form-group">
                    <label class="form-label">이름</label>
                    <input class="form-input" type="text" name="name" id="createBoardName" placeholder="보드 이름" maxlength="50" required>
                    <span class="char-count" id="createBoardNameCount">0/50</span>
                </div>
                <div class="form-group">
                    <label class="form-label">컬러</label>
                    <div class="color-swatch-row">
                        <label class="color-swatch"><input type="radio" name="color" value="p1" checked><span class="swatch-dot" style="background: var(--p1-color);"></span></label>
                        <label class="color-swatch"><input type="radio" name="color" value="p2"><span class="swatch-dot" style="background: var(--p2-color);"></span></label>
                        <label class="color-swatch"><input type="radio" name="color" value="p3"><span class="swatch-dot" style="background: var(--p3-color);"></span></label>
                        <label class="color-swatch"><input type="radio" name="color" value="p4"><span class="swatch-dot" style="background: var(--p4-color);"></span></label>
                        <label class="color-swatch"><input type="radio" name="color" value="p5"><span class="swatch-dot" style="background: var(--p5-color);"></span></label>
                        <label class="color-swatch"><input type="radio" name="color" value="p6"><span class="swatch-dot" style="background: var(--p6-color);"></span></label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">설명 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
                    <input class="form-input" type="text" name="description" placeholder="보드 설명">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="btn-cancel-board-create">취소</button>
                    <button type="submit" class="btn-modal-confirm">추가</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/scripts :: common-scripts}"></th:block>
    <script th:src="@{/js/components/CharCounter.js}"></script>
    <script th:src="@{/js/MainPage.js}"></script>

</body>

</html>
