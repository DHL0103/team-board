<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Board</title>

    <link href="/css/lib/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/main.css">
    
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
                    <rect x="1" y="1" width="6" height="6" rx="1" />
                    <rect x="9" y="1" width="6" height="6" rx="1" />
                    <rect x="1" y="9" width="6" height="6" rx="1" />
                    <rect x="9" y="9" width="6" height="6" rx="1" />
                </svg>
            </div>
            Team Board
        </div>
        <a href="/post/new" class="btn-new">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            새 작업
        </a>
    </header>

    <div class="page-top">
        <div>
            <div class="page-title">팀별 작업 현황</div>
            <div class="page-meta" th:text="'전체 ' + ${#lists.size(postList)} + '개의 작업 · 완료 승인된 항목은 숨김 처리됩니다'">전체 0개
            </div>
        </div>
        <div class="view-tabs">
            <div class="view-tab active">보드</div>
            <div class="view-tab">목록</div>
        </div>
    </div>

    <div class="kanban-wrap">
        <div class="row g-3">

            <!-- Backend팀 -->
            <div class="col-12 col-md-4">
                <div class="kanban-col col-backend">
                    <div class="col-header">
                        <span class="team-badge"><span class="team-dot"></span>Backend팀</span>
                        <span class="col-count" id="count-backend">0개</span>
                        <button class="btn-col-add" id="btn-add-backend">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>
                    <div class="col-body" id="body-backend">
                        <div class="empty-col" th:if="${#lists.isEmpty(postList)}">
                            <div class="empty-icon">＋</div><span>등록된 작업이 없습니다</span>
                        </div>
                        <div class="board-card" th:each="post : ${postList}" th:if="${post.boardId == 1}"
                            th:data-id="${post.id}" th:data-status="${post.status}" th:data-member-id="${post.memberId}"
                            th:data-board-id="${post.boardId}"
                            th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                            <div class="card-team-line"></div>
                            <div class="card-top">
                                <div class="card-title" th:text="${post.title}">작업 제목</div>
                                <span class="due-chip"
                                    th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                                    <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
                                        <rect x="1" y="1.5" width="8" height="7.5" rx="1" />
                                        <path d="M3 1v1M7 1v1M1 4h8" />
                                    </svg>
                                    <span class="due-label"
                                        th:text="${post.dueDate != null ? #temporals.format(post.dueDate,'MM.dd') : '기한 없음'}"></span>
                                </span>
                            </div>
                            <div class="card-content" th:text="${post.content}">내용</div>
                            <div class="card-footer">
                                <div class="card-left">
                                    <span class="status-chip" th:data-status="${post.status}"
                                        th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : post.status}"></span>
                                    <div class="card-writer">
                                        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
                                            <circle cx="6" cy="4.5" r="2.5" />
                                            <path d="M1.5 10.5c0-2 1.8-3.5 4.5-3.5s4.5 1.5 4.5 3.5" />
                                        </svg>
                                        <span class="writer-name">로딩 중...</span>
                                    </div>
                                </div>
                                <span class="card-date" th:text="${#temporals.format(post.createdAt,'MM.dd 등록')}">01.01
                                    등록</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Frontend팀 -->
            <div class="col-12 col-md-4">
                <div class="kanban-col col-frontend">
                    <div class="col-header">
                        <span class="team-badge"><span class="team-dot"></span>Frontend팀</span>
                        <span class="col-count" id="count-frontend">0개</span>
                        <button class="btn-col-add" id="btn-add-frontend">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>
                    <div class="col-body" id="body-frontend">
                        <div class="board-card" th:each="post : ${postList}" th:if="${post.boardId == 2}"
                            th:data-id="${post.id}" th:data-status="${post.status}" th:data-member-id="${post.memberId}"
                            th:data-board-id="${post.boardId}"
                            th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                            <div class="card-team-line"></div>
                            <div class="card-top">
                                <div class="card-title" th:text="${post.title}">작업 제목</div>
                                <span class="due-chip"
                                    th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                                    <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
                                        <rect x="1" y="1.5" width="8" height="7.5" rx="1" />
                                        <path d="M3 1v1M7 1v1M1 4h8" />
                                    </svg>
                                    <span class="due-label"
                                        th:text="${post.dueDate != null ? #temporals.format(post.dueDate,'MM.dd') : '기한 없음'}"></span>
                                </span>
                            </div>
                            <div class="card-content" th:text="${post.content}">내용</div>
                            <div class="card-footer">
                                <div class="card-left">
                                    <span class="status-chip" th:data-status="${post.status}"
                                        th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : post.status}"></span>
                                    <div class="card-writer">
                                        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
                                            <circle cx="6" cy="4.5" r="2.5" />
                                            <path d="M1.5 10.5c0-2 1.8-3.5 4.5-3.5s4.5 1.5 4.5 3.5" />
                                        </svg>
                                        <span class="writer-name">로딩 중...</span>
                                    </div>
                                </div>
                                <span class="card-date" th:text="${#temporals.format(post.createdAt,'MM.dd 등록')}">01.01
                                    등록</span>
                            </div>
                        </div>
                        <div class="empty-col" id="empty-frontend" style="display:none;">
                            <div class="empty-icon">＋</div><span>등록된 작업이 없습니다</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Design팀 -->
            <div class="col-12 col-md-4">
                <div class="kanban-col col-design">
                    <div class="col-header">
                        <span class="team-badge"><span class="team-dot"></span>Design팀</span>
                        <span class="col-count" id="count-design">0개</span>
                        <button class="btn-col-add" id="btn-add-design">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>
                    <div class="col-body" id="body-design">
                        <div class="board-card" th:each="post : ${postList}" th:if="${post.boardId == 3}"
                            th:data-id="${post.id}" th:data-status="${post.status}" th:data-member-id="${post.memberId}"
                            th:data-board-id="${post.boardId}"
                            th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                            <div class="card-team-line"></div>
                            <div class="card-top">
                                <div class="card-title" th:text="${post.title}">작업 제목</div>
                                <span class="due-chip"
                                    th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate,'yyyy-MM-dd') : ''}">
                                    <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
                                        <rect x="1" y="1.5" width="8" height="7.5" rx="1" />
                                        <path d="M3 1v1M7 1v1M1 4h8" />
                                    </svg>
                                    <span class="due-label"
                                        th:text="${post.dueDate != null ? #temporals.format(post.dueDate,'MM.dd') : '기한 없음'}"></span>
                                </span>
                            </div>
                            <div class="card-content" th:text="${post.content}">내용</div>
                            <div class="card-footer">
                                <div class="card-left">
                                    <span class="status-chip" th:data-status="${post.status}"
                                        th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : post.status}"></span>
                                    <div class="card-writer">
                                        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
                                            <circle cx="6" cy="4.5" r="2.5" />
                                            <path d="M1.5 10.5c0-2 1.8-3.5 4.5-3.5s4.5 1.5 4.5 3.5" />
                                        </svg>
                                        <span class="writer-name">로딩 중...</span>
                                    </div>
                                </div>
                                <span class="card-date" th:text="${#temporals.format(post.createdAt,'MM.dd 등록')}">01.01
                                    등록</span>
                            </div>
                        </div>
                        <div class="empty-col" id="empty-design" style="display:none;">
                            <div class="empty-icon">＋</div><span>등록된 작업이 없습니다</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── 작업 생성 모달 ── -->
    <div class="modal-overlay" id="createModal" >
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title-row">
                    <span class="modal-title">새 작업 추가</span>
                    <span class="modal-team-badge" id="modal-team-badge"></span>
                </div>
                <button class="modal-close" id="btn-modal-close">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                        <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <form action="/post/create" method="post">
                <input type="hidden" name="boardId" id="modal-board-id">

                <div class="form-group">
                    <label class="form-label">제목</label>
                    <input class="form-input" type="text" name="title" placeholder="작업 제목을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label class="form-label">내용</label>
                    <textarea class="form-input" name="content" placeholder="작업 내용을 입력하세요"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">마감일 <span
                            style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
                    <!-- hidden input — JS가 yyyy-MM-ddTHH:mm:ss 형식으로 채워줌 -->
                    <input type="hidden" name="dueDate" id="modal-due-value">
                    <div class="due-picker">
                        <div class="due-picker-header">
                            <span class="due-month-label" id="due-month-label">2025년 2월</span>
                            <div class="due-nav">
                                <span class="due-selected-display" id="due-selected-display">선택 안 함</span>
                                <button type="button" class="due-nav-btn" id="btn-prev-month">‹</button>
                                <button type="button" class="due-nav-btn" id="btn-next-month">›</button>
                            </div>
                        </div>
                        <div class="due-grid">
                            <div class="due-dow">
                                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                            </div>
                            <div class="due-days" id="due-days"></div>
                        </div>
                        <button type="button" class="due-clear-btn" id="btn-clear-due">선택 초기화</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">작업 추가</button>
            </form>
        </div>
    </div>

    <script src="/js/lib/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // ── 기존 로직 ──
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const colMap = {
            backend: { bodyId: "body-backend", countId: "count-backend" },
            frontend: { bodyId: "body-frontend", countId: "count-frontend", emptyId: "empty-frontend" },
            design: { bodyId: "body-design", countId: "count-design", emptyId: "empty-design" },
        };
        
        Object.values(colMap).forEach(({ bodyId, countId, emptyId }) => {
            const body = document.getElementById(bodyId);
            if (!body) return;
            const cards = body.querySelectorAll(".board-card");
            let visible = 0;
            cards.forEach(card => { if (card.dataset.status === "COMPLETED") card.style.display = "none"; else visible++; });
            document.getElementById(countId).textContent = visible + "개";
            if (emptyId && visible === 0) document.getElementById(emptyId).style.display = "flex";
        });

        document.querySelectorAll(".due-chip").forEach(chip => {
            const due = chip.dataset.due;
            if (!due) { chip.classList.add("none"); return; }
            const dueDate = new Date(due);
            const diffDays = Math.floor((dueDate - today) / (1000 * 60 * 60 * 24));
            const label = chip.querySelector(".due-label");
            if (diffDays < 0) { chip.classList.add("over"); label.textContent += " 초과"; }
            else if (diffDays === 0) { chip.classList.add("warn"); label.textContent = "오늘 마감"; }
            else if (diffDays === 1) { chip.classList.add("warn"); label.textContent = "내일 마감"; }
            else if (diffDays <= 3) { chip.classList.add("warn"); }
            else { chip.classList.add("safe"); }
        });

        document.querySelectorAll(".status-chip").forEach(chip => {
            const s = chip.dataset.status;
            if (s === "PROGRESS") chip.classList.add("progress");
            if (s === "REQUESTED") chip.classList.add("requested");
        });

        const boardUrlMap = { "1": "backend", "2": "frontend", "3": "design" };
        document.querySelectorAll(".board-card").forEach(card => {
            card.addEventListener("mouseenter", () => card.classList.add("is-hovered"));
            card.addEventListener("mouseleave", () => card.classList.remove("is-hovered"));
            card.addEventListener("click", () => {
                const postId = card.dataset.id;
                if (postId) location.href = `/post/${postId}`;
            });
        });

        document.querySelectorAll(".board-card").forEach(async card => {
            if (card.dataset.status === "COMPLETED") return;
            const memberId = card.dataset.memberId;
            if (!memberId) return;
            const name = await fetchUsername(memberId);
            card.querySelector(".writer-name").textContent = name;
        });

        document.querySelectorAll(".view-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".view-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
            });
        });

        // ── 모달 ──
        const teamStyles = {
            backend: { bg: "var(--backend-bg)", color: "var(--backend-color)", border: "var(--backend-border)" },
            frontend: { bg: "var(--frontend-bg)", color: "var(--frontend-color)", border: "var(--frontend-border)" },
            design: { bg: "var(--design-bg)", color: "var(--design-color)", border: "var(--design-border)" },
        };

        const createModal = document.getElementById("createModal");

        function openModal(boardId, teamName, teamKey) {
            document.getElementById("modal-board-id").value = boardId;
            const badge = document.getElementById("modal-team-badge");
            const s = teamStyles[teamKey];
            badge.textContent = teamName;
            badge.style.background = s.bg;
            badge.style.color = s.color;
            badge.style.border = `1px solid ${s.border}`;
            clearDue();
            renderCalendar();
            createModal.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            createModal.classList.remove("open");
            document.body.style.overflow = "";
        }

        document.getElementById("btn-add-backend").addEventListener("click", () => openModal(1, "Backend팀", "backend"));
        document.getElementById("btn-add-frontend").addEventListener("click", () => openModal(2, "Frontend팀", "frontend"));
        document.getElementById("btn-add-design").addEventListener("click", () => openModal(3, "Design팀", "design"));

        createModal.addEventListener("click", (e) => {
            if (e.target === createModal) closeModal();
        });

        document.getElementById("btn-modal-close").addEventListener("click", closeModal);

        // ESC 닫기
        document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

        // ── 날짜 피커 ──
        let pickerYear = today.getFullYear();
        let pickerMonth = today.getMonth(); // 0-indexed
        let selectedDate = null;

        function changeMonth(dir) {
            pickerMonth += dir;
            if (pickerMonth < 0) { pickerMonth = 11; pickerYear--; }
            if (pickerMonth > 11) { pickerMonth = 0; pickerYear++; }
            renderCalendar();
        }

        document.getElementById("btn-prev-month").addEventListener("click", () => changeMonth(-1));
        document.getElementById("btn-next-month").addEventListener("click", () => changeMonth(1));

        function renderCalendar() {
            const label = document.getElementById("due-month-label");
            label.textContent = `${pickerYear}년 ${pickerMonth + 1}월`;

            const grid = document.getElementById("due-days");
            grid.innerHTML = "";

            const firstDay = new Date(pickerYear, pickerMonth, 1).getDay(); // 0=일
            const lastDate = new Date(pickerYear, pickerMonth + 1, 0).getDate();

            // 앞 빈칸
            for (let i = 0; i < firstDay; i++) {
                const el = document.createElement("div");
                el.className = "due-day empty";
                grid.appendChild(el);
            }

            for (let d = 1; d <= lastDate; d++) {
                const el = document.createElement("div");
                el.className = "due-day";
                el.textContent = d;

                const thisDate = new Date(pickerYear, pickerMonth, d);
                const isToday = thisDate.getTime() === today.getTime();
                const isPast = thisDate < today;

                if (isPast) el.classList.add("past");
                if (isToday) el.classList.add("today");
                if (selectedDate && thisDate.getTime() === selectedDate.getTime()) el.classList.add("selected");

                if (!isPast) {
                    el.addEventListener("click", () => selectDate(thisDate));
                }
                grid.appendChild(el);
            }
        }

        function selectDate(date) {
            selectedDate = date;

            // hidden input에 LocalDateTime 형식으로 세팅 (자정 기준)
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            document.getElementById("modal-due-value").value = `${y}-${m}-${d}T00:00:00`;

            // 표시 업데이트
            document.getElementById("due-selected-display").textContent = `${m}.${d} 마감`;

            renderCalendar();
        }

        function clearDue() {
            selectedDate = null;
            document.getElementById("modal-due-value").value = "";
            document.getElementById("due-selected-display").textContent = "선택 안 함";
            renderCalendar();
        }

        document.getElementById("btn-clear-due").addEventListener("click", () => clearDue());

        // 초기 렌더
        renderCalendar();</script>

</body>

</html>
