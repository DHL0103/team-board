<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

    <div class="toast" id="errorToast"
         th:text="${param.error == 'fileSize' ? '파일 크기는 10MB를 초과할 수 없습니다.' : (param.error != null ? '오류가 발생했습니다.' : '')}">
    </div>

    <div th:replace="~{fragments/header :: main-header}"></div>

    <div class="page-top">
        <div>
            <div class="page-title">내 보드</div>
            <div class="page-meta" th:text="'총 ' + ${#lists.size(boardList)} + '개의 보드'">총 0개의 보드</div>
        </div>
    </div>

    <div class="board-grid-wrap">
        <!-- 빈 상태 -->
        <div class="board-grid-empty" th:if="${#lists.isEmpty(boardList)}">
            <div class="board-grid-empty-icon">
                <svg width="24" height="24"><use href="/img/icons.svg#icon-alert"></use></svg>
            </div>
            <div>소속된 보드가 없습니다.</div>
        </div>

        <div class="board-grid" th:unless="${#lists.isEmpty(boardList)}">
            <a class="board-grid-card"
               th:each="board : ${boardList}"
               th:href="@{'/board/' + ${board.id}}"
               th:classappend="${'palette-' + board.color}">
                <div class="board-grid-card-bar"></div>
                <div class="board-grid-card-body">
                    <div class="board-grid-card-name" th:text="${board.name}">보드명</div>
                    <div class="board-grid-card-desc" th:text="${board.description}">설명</div>
                </div>
                <div class="board-grid-card-footer">
                    <span class="team-badge"
                          th:classappend="${'badge-' + board.color}">
                        <span class="team-dot"></span>
                        <span th:text="${board.color}">p1</span>
                    </span>
                </div>
            </a>
        </div>
    </div>

    <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/main_page.js}"></script>

</body>

</html>
