<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>
  <a href="/board" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
        <rect x="1" y="1" width="6" height="6" rx="1" />
        <rect x="9" y="1" width="6" height="6" rx="1" />
        <rect x="1" y="9" width="6" height="6" rx="1" />
        <rect x="9" y="9" width="6" height="6" rx="1" />
      </svg>
    </div>
    Team Board
  </a>
  <a href="/board" class="btn-back">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>
    보드로 돌아가기
  </a>
</header>

<div class="detail-wrap">
  <div class="breadcrumb-row">
    <a href="/">보드</a> <span class="breadcrumb-sep">›</span>
    <span th:text="${post.boardId == 1 ? 'Backend팀' : post.boardId == 2 ? 'Frontend팀' : 'Design팀'}">팀</span> <span
          class="breadcrumb-sep">›</span>
    <span th:text="${post.title}">제목</span>
  </div>

  <div class="toast" id="errorToast" th:if="${param.error}">
    본인이 작성한 글만 삭제할 수 있습니다.
  </div>

  <div class="post-card">
    <div class="post-team-bar"
         th:classappend="${post.boardId == 1 ? 'team-backend' : post.boardId == 2 ? 'team-frontend' : 'team-design'}">
    </div>
    <div class="post-header">
      <div class="post-meta-row">
          <span class="team-badge"
                th:classappend="${post.boardId == 1 ? 'badge-backend' : post.boardId == 2 ? 'badge-frontend' : 'badge-design'}">
            <span class="team-dot"></span>
            <span th:text="${post.boardId == 1 ? 'Backend팀' : post.boardId == 2 ? 'Frontend팀' : 'Design팀'}">팀</span>
          </span>
        <span class="status-chip"
              th:classappend="${post.status == 'PROGRESS' ? 'chip-progress' : post.status == 'REQUESTED' ? 'chip-requested' : 'chip-completed'}"
              th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : '완료'}"></span>
        <span class="due-chip" id="due-chip"
              th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="1" y="1.5" width="8" height="7.5" rx="1" />
              <path d="M3 1v1M7 1v1M1 4h8" />
            </svg>
            <span id="due-label"
                  th:text="${post.dueDate != null ? #temporals.format(post.dueDate, 'MM.dd') + ' 마감' : '기한 없음'}"></span>
          </span>
      </div>
      <div class="post-title" th:text="${post.title}">제목</div>
      <div class="post-info-row">
        <div class="post-info-item"><span id="writer-name" style="font-weight:500;">로딩 중...</span></div>
        <div class="post-info-item"><span
                th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')} + ' 등록'">등록일</span></div>
        <div class="post-info-item" th:if="${post.updatedAt != null}"><span
                th:text="${#temporals.format(post.updatedAt, 'yyyy.MM.dd HH:mm')} + ' 수정'">수정일</span></div>
      </div>
    </div>
    <div class="post-body">
      <div class="post-content" th:text="${post.content}">내용</div>
    </div>

    <div class="post-actions">
      <div class="post-actions-left">
        <button th:if="${isOwner}" class="btn-delete" id="btn-delete">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5">
            <path
                    d="M2 3.5h9M5 3.5V2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1M10.5 3.5l-.7 7a1 1 0 0 1-1 .9H4.2a1 1 0 0 1-1-.9l-.7-7" />
          </svg> 삭제
        </button>
      </div>
      <div class="post-actions-right">
        <button th:if="${isOwner}" class="btn-edit" id="btn-edit">수정</button>
        <a th:if="${post.status == 'PROGRESS'}" th:href="'/post/' + ${post.id} + '/request'" class="btn-request">✓ 완료
          요청</a>
      </div>
    </div>
  </div>

  <div class="comment-section">
    <div class="comment-header">
      <span class="comment-header-title">피드백 & 댓글</span>
      <span class="comment-count-badge"
            th:text="${commentList != null ? #lists.size(commentList) : 0} + '개'">0개</span>
    </div>
    <div class="comment-list">
      <div class="comment-empty" th:if="${commentList == null or #lists.isEmpty(commentList)}">댓글이 없습니다.</div>
      <div class="comment-item" th:each="comment : ${commentList}">
        <div class="comment-top">
          <div class="avatar-md" th:text="${#strings.substring(comment.writerName, 0, 1)}">U</div>
          <span class="comment-writer" th:text="${comment.writerName}">작성자</span>
          <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}">01.01</span>
        </div>
        <div class="comment-content" th:text="${comment.content}">내용</div>
      </div>
    </div>
    <div class="comment-form">
      <form th:action="'/post/' + ${post.id} + '/comment'" method="post">
        <div class="comment-input-row">
            <textarea class="comment-textarea" name="content" placeholder="댓글을 입력하세요..."
                      id="commentTextarea"></textarea>
          <button type="submit" class="btn-comment-submit">등록</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title-row">
        <span class="modal-title">작업 수정</span>
        <span class="modal-team-badge"
              th:style="${post.boardId == 1 ? 'background:var(--backend-bg);color:var(--backend-color);border:1px solid var(--backend-border)' : post.boardId == 2 ? 'background:var(--frontend-bg);color:var(--frontend-color);border:1px solid var(--frontend-border)' : 'background:var(--design-bg);color:var(--design-color);border:1px solid var(--design-border)'}"
              th:text="${post.boardId == 1 ? 'Backend팀' : post.boardId == 2 ? 'Frontend팀' : 'Design팀'}">팀</span>
      </div>
      <button type="button" class="modal-close" id="btn-edit-close">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <form th:action="@{/post/update/{id}(id=${post.id})}" method="post">
      <div class="form-group">
        <label class="form-label">제목</label>
        <input type="text" name="title" th:value="${post.title}" class="form-input" required />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea name="content" class="form-input" th:text="${post.content}" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">마감일 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
        <input type="hidden" name="dueDate" id="edit-due-value"
               th:value="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') + 'T00:00:00' : ''}">
        <div class="due-picker">
          <div class="due-picker-header">
            <span class="due-month-label" id="edit-month-label"></span>
            <div class="due-nav">
              <span class="due-selected-display" id="edit-selected-display">선택 안 함</span>
              <button type="button" class="due-nav-btn" id="btn-edit-prev-month">‹</button>
              <button type="button" class="due-nav-btn" id="btn-edit-next-month">›</button>
            </div>
          </div>
          <div class="due-grid">
            <div class="due-dow">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="due-days" id="edit-due-days"></div>
          </div>
          <button type="button" class="due-clear-btn" id="btn-edit-clear-due">선택 초기화</button>
        </div>
      </div>
      <button type="submit" class="btn-submit">수정 완료</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="#dc2626" stroke-width="1.6">
        <path
                d="M3 4.5h12M7 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M14.5 4.5l-.9 9.5a1.5 1.5 0 0 1-1.5 1.35H5.9A1.5 1.5 0 0 1 4.4 14L3.5 4.5" />
      </svg>
    </div>
    <div class="modal-title">정말 삭제하시겠습니까?</div>
    <div class="modal-desc">삭제된 데이터는 복구할 수 없습니다.</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btn-delete-cancel">취소</button>
      <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn-modal-delete">삭제 승인</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script th:inline="javascript">
  const editModal = document.getElementById("editModal");
  const btnEdit = document.getElementById("btn-edit");
  const btnEditClose = document.getElementById("btn-edit-close");

  function closeEditModal() {
      editModal.classList.remove("open");
      document.body.style.overflow = "";
  }

  if (btnEdit) {
      btnEdit.addEventListener("click", () => {
          editModal.classList.add("open");
          document.body.style.overflow = "hidden";
      });
  }
  if (btnEditClose) {
      btnEditClose.addEventListener("click", closeEditModal);
  }
  if (editModal) {
      editModal.addEventListener("click", (e) => {
          if (e.target.id === "editModal") closeEditModal();
      });
  }

  const deleteModal = document.getElementById("deleteModal");
  const btnDelete = document.getElementById("btn-delete");
  const btnDeleteCancel = document.getElementById("btn-delete-cancel");

  // 삭제 모달 열기
  if (btnDelete) {
      btnDelete.addEventListener("click", () => {
          deleteModal.classList.add("open");
          document.body.style.overflow = "hidden";
      });
  }

  // 삭제 모달 닫기
  if (btnDeleteCancel) {
      btnDeleteCancel.addEventListener("click", () => {
          deleteModal.classList.remove("open");
          document.body.style.overflow = "";
      });
  }

  // 모달 밖 클릭 시 닫기
  if (deleteModal) {
      deleteModal.addEventListener("click", (e) => {
          if (e.target.id === "deleteModal") {
              deleteModal.classList.remove("open");
              document.body.style.overflow = "";
          }
      });
  }

  // 작성자 이름 Fetch
  const memberId = [[${post.memberId}]];
  fetchUsername(memberId).then(name => {
      document.getElementById("writer-name").textContent = name;
  });

  // 에러 토스트
  window.addEventListener("load", () => {
      const toast = document.getElementById("errorToast");
      if (toast) {
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 3000);
      }
  });

  // ── 수정 모달 캘린더 피커 ──
  const editToday = new Date();
  editToday.setHours(0, 0, 0, 0);

  const existingDueDateStr = /*[[${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}]]*/ '';

  let editPickerYear = editToday.getFullYear();
  let editPickerMonth = editToday.getMonth();
  let editSelectedDate = null;

  if (existingDueDateStr) {
      editSelectedDate = new Date(existingDueDateStr + 'T00:00:00');
      editPickerYear = editSelectedDate.getFullYear();
      editPickerMonth = editSelectedDate.getMonth();
      const m = String(editSelectedDate.getMonth() + 1).padStart(2, '0');
      const d = String(editSelectedDate.getDate()).padStart(2, '0');
      document.getElementById('edit-selected-display').textContent = `${m}.${d} 마감`;
  }

  function editChangeMonth(dir) {
      editPickerMonth += dir;
      if (editPickerMonth < 0) { editPickerMonth = 11; editPickerYear--; }
      if (editPickerMonth > 11) { editPickerMonth = 0; editPickerYear++; }
      renderEditCalendar();
  }

  document.getElementById('btn-edit-prev-month').addEventListener('click', () => editChangeMonth(-1));
  document.getElementById('btn-edit-next-month').addEventListener('click', () => editChangeMonth(1));

  function renderEditCalendar() {
      document.getElementById('edit-month-label').textContent = `${editPickerYear}년 ${editPickerMonth + 1}월`;
      const grid = document.getElementById('edit-due-days');
      grid.innerHTML = '';

      const firstDay = new Date(editPickerYear, editPickerMonth, 1).getDay();
      const lastDate = new Date(editPickerYear, editPickerMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
          const el = document.createElement('div');
          el.className = 'due-day empty';
          grid.appendChild(el);
      }

      for (let d = 1; d <= lastDate; d++) {
          const el = document.createElement('div');
          el.className = 'due-day';
          el.textContent = d;

          const thisDate = new Date(editPickerYear, editPickerMonth, d);
          const isToday = thisDate.getTime() === editToday.getTime();
          const isPast = thisDate < editToday;

          if (isPast) el.classList.add('past');
          if (isToday) el.classList.add('today');
          if (editSelectedDate && thisDate.getTime() === editSelectedDate.getTime()) el.classList.add('selected');

          if (!isPast) {
              el.addEventListener('click', () => editSelectDate(thisDate));
          }
          grid.appendChild(el);
      }
  }

  function editSelectDate(date) {
      editSelectedDate = date;
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      document.getElementById('edit-due-value').value = `${y}-${m}-${d}T00:00:00`;
      document.getElementById('edit-selected-display').textContent = `${m}.${d} 마감`;
      renderEditCalendar();
  }

  function clearEditDue() {
      editSelectedDate = null;
      document.getElementById('edit-due-value').value = '';
      document.getElementById('edit-selected-display').textContent = '선택 안 함';
      renderEditCalendar();
  }

  document.getElementById('btn-edit-clear-due').addEventListener('click', clearEditDue);

  renderEditCalendar();
</script>
</body>

</html>
