<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>작업 상세</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body th:data-member-id="${post.memberId}"
      th:data-due-date="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">

<div th:replace="~{fragments/header :: back-header}"></div>

<div class="detail-wrap" th:with="palette=${boardColor}">
  <div class="breadcrumb-row">
    <a href="/">보드</a> <span class="breadcrumb-sep">›</span>
    <span th:text="${boardName}">팀</span> <span
          class="breadcrumb-sep">›</span>
    <span th:text="${post.title}">제목</span>
  </div>

  <div class="toast" id="errorToast"
       th:text="${param.error == 'fileSize' ? '파일 크기는 10MB를 초과할 수 없습니다.' : (param.error != null ? '본인이 작성한 글만 삭제할 수 있습니다.' : '')}">
  </div>

  <div class="post-card">
    <div class="post-team-bar" th:classappend="${'col-' + palette}"></div>
    <div class="post-header">
      <div class="post-meta-row">
          <span class="team-badge" th:classappend="${'badge-' + palette}">
            <span class="team-dot"></span>
            <span th:text="${boardName}">팀</span>
          </span>
        <span class="status-chip"
              th:classappend="${post.status == 'PROGRESS' ? 'chip-progress' : post.status == 'REQUESTED' ? 'chip-requested' : post.status == 'REJECTED' ? 'chip-rejected' : 'chip-completed'}"
              th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : post.status == 'REJECTED' ? '반려' : '완료'}"></span>
        <span class="due-chip" id="due-chip"
              th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
            <svg width="10" height="10"><use href="/img/icons.svg#icon-calendar"></use></svg>
            <span class="due-label"
                  th:text="${post.dueDate != null ? #temporals.format(post.dueDate, 'MM.dd') : '기한 없음'}"></span>
          </span>
      </div>
      <div class="post-title" th:text="${post.title}">제목</div>
      <div class="post-info-row">
        <div class="post-info-item"><span id="writer-name" style="font-weight:500;">로딩 중...</span></div>
        <div class="post-info-item"><span
                th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')} + ' 등록'">등록일</span></div>
        <div class="post-info-item" th:if="${post.updatedAt != null}"><span
                th:text="${#temporals.format(post.updatedAt, 'yyyy.MM.dd HH:mm')} + ' 수정'">수정일</span></div>
      </div>
    </div>
    <div class="post-body">
      <div class="post-content" th:text="${post.content}">내용</div>
    </div>

    <div class="post-files" th:if="${postFiles != null and !#lists.isEmpty(postFiles)}">
      <div class="post-files-label">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-upload"></use></svg>
        첨부파일
      </div>
      <div class="file-chip-list">
        <a class="file-chip" th:each="file : ${postFiles}"
           th:href="@{/files/{storedPath}(storedPath=${file.storedPath}, name=${file.originalName})}"
           th:text="${file.originalName}"
           target="_blank"></a>
      </div>
    </div>

    <div class="post-actions">
      <div class="post-actions-left">
        <button th:if="${isOwner}" class="btn-delete" id="btn-delete">
          <svg width="13" height="13"><use href="/img/icons.svg#icon-trash"></use></svg> 삭제
        </button>
      </div>
      <div class="post-actions-right">
        <button th:if="${isOwner}" class="btn-edit" id="btn-edit">수정</button>
        <form th:if="${isOwner and (post.status == 'PROGRESS' or post.status == 'REJECTED')}" th:action="@{/board/{boardId}/post/request/{id}(boardId=${post.boardId},id=${post.id})}" method="post" style="margin:0;">
          <button type="submit" class="btn-request">✓ 완료 요청</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 반려 이력 사이드바 -->
  <div class="rejection-panel" th:if="${rejections != null and not #lists.isEmpty(rejections)}">
    <div class="rejection-panel-header">
      <span class="rejection-panel-title">반려 이력</span>
      <span class="rejection-panel-count" th:text="${#lists.size(rejections)} + '건'">0건</span>
    </div>
    <div class="rejection-list">
      <div class="rejection-item" th:each="rejection : ${rejections}"
           th:data-rejected-by="${rejection.rejectedBy}">
        <div class="rejection-date">
          <span class="rejection-rejector">로딩 중...</span>
          <span th:text="${#temporals.format(rejection.createdAt, 'MM.dd HH:mm')}">01.01</span>
        </div>
        <div class="rejection-reason" th:text="${rejection.reason}">반려 사유</div>
      </div>
    </div>
  </div>

  <div class="comment-section">
    <div class="comment-header">
      <span class="comment-header-title">피드백 & 댓글</span>
      <span class="comment-count-badge"
            th:text="${commentList != null ? #lists.size(commentList) : 0} + '개'">0개</span>
    </div>
    <div class="comment-list">
      <div class="comment-empty" th:if="${commentList == null or #lists.isEmpty(commentList)}">댓글이 없습니다.</div>
      <div class="comment-item" th:each="comment : ${commentList}">
        <div class="comment-top">
          <div class="avatar-md" th:text="${#strings.substring(comment.writerName, 0, 1)}">U</div>
          <span class="comment-writer" th:text="${comment.writerName}">작성자</span>
          <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}">01.01</span>
        </div>
        <div class="comment-content" th:text="${comment.content}">내용</div>
      </div>
    </div>
    <div class="comment-form">
      <form th:action="'/post/' + ${post.id} + '/comment'" method="post">
        <div class="comment-input-row">
            <textarea class="comment-textarea" name="content" placeholder="댓글을 입력하세요..."
                      id="commentTextarea"></textarea>
          <button type="submit" class="btn-comment-submit">등록</button>
        </div>
      </form>
    </div>
  </div>


<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title-row">
        <span class="modal-title">작업 수정</span>
        <span class="modal-team-badge" th:classappend="${'badge-' + palette}" th:text="${boardName}">팀</span>
      </div>
      <button type="button" class="modal-close" id="btn-edit-close">
        <svg width="10" height="10"><use href="/img/icons.svg#icon-close"></use></svg>
      </button>
    </div>
    <form id="edit-post-form" th:action="@{/board/{boardId}/post/update/{id}(boardId=${post.boardId},id=${post.id})}" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label class="form-label">제목</label>
        <input type="text" name="title" th:value="${post.title}" class="form-input" required />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea name="content" class="form-input" th:text="${post.content}" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">마감일 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
        <input type="hidden" name="dueDate" id="edit-due-value"
               th:value="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') + 'T00:00:00' : ''}">
        <div class="due-picker">
          <div class="due-picker-header">
            <span class="due-month-label" id="edit-month-label"></span>
            <div class="due-nav">
              <span class="due-selected-display" id="edit-selected-display">선택 안 함</span>
              <button type="button" class="due-nav-btn" id="btn-edit-prev-month">‹</button>
              <button type="button" class="due-nav-btn" id="btn-edit-next-month">›</button>
            </div>
          </div>
          <div class="due-grid">
            <div class="due-dow">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="due-days" id="edit-due-days"></div>
          </div>
          <button type="button" class="due-clear-btn" id="btn-edit-clear-due">선택 초기화</button>
        </div>
      </div>
      <div class="form-group" th:if="${postFiles != null and !#lists.isEmpty(postFiles)}">
        <label class="form-label">기존 첨부파일 <span style="color:var(--text-muted);font-weight:400;">(체크 시 삭제)</span></label>
        <div class="existing-file-list">
          <label class="existing-file-item" th:each="file : ${postFiles}">
            <input type="checkbox" name="deleteFileIds" th:value="${file.id}">
            <span class="file-name" th:text="${file.originalName}">파일명</span>
          </label>
        </div>
      </div>

      <div class="form-group" th:if="${boardUserList != null and !boardUserList.isEmpty()}">
        <label class="form-label">담당자 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
        <div class="selected-assignee-list" id="edit-selected-assignee-list">
          <span class="selected-assignee-chip"
                th:each="assignee : ${postAssignees}"
                th:data-member-id="${assignee.memberId}"
                th:data-username="${assignee.username}">
            <span class="assignee-chip-name" th:text="${assignee.username}"></span>
            <button type="button" class="selected-assignee-remove" th:data-member-id="${assignee.memberId}">×</button>
          </span>
        </div>
        <div class="assignee-picker" id="edit-assignee-picker">
          <button type="button" class="assignee-add-btn" id="btn-edit-add-assignee">
            <svg width="10" height="10"><use href="/img/icons.svg#icon-plus"></use></svg>
            담당자 추가
          </button>
          <div class="assignee-dropdown" id="edit-assignee-dropdown">
            <input type="text" class="assignee-search-input" id="edit-assignee-search"
                   placeholder="이름으로 검색" autocomplete="off">
            <div class="assignee-option-list" id="edit-assignee-option-list">
              <button type="button" class="assignee-option"
                      th:each="member : ${boardUserList}"
                      th:data-member-id="${member.memberId}"
                      th:data-username="${member.username}"
                      th:text="${member.username}">
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <input type="file" name="files" id="edit-file-input" multiple hidden>
        <button type="button" class="file-upload-btn" id="btn-edit-file-attach">
          <svg width="12" height="12"><use href="/img/icons.svg#icon-upload"></use></svg>
          파일 추가
        </button>
        <div class="file-chip-list" id="edit-file-chip-list"></div>
      </div>

      <button type="submit" class="btn-submit">수정 완료</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg width="20" height="20"><use href="/img/icons.svg#icon-trash-lg"></use></svg>
    </div>
    <div class="modal-title">정말 삭제하시겠습니까?</div>
    <div class="modal-desc">삭제된 데이터는 복구할 수 없습니다.</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btn-delete-cancel">취소</button>
      <form th:action="@{/board/{boardId}/post/delete/{id}(boardId=${post.boardId},id=${post.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn-modal-delete">삭제 승인</button>
      </form>
    </div>
  </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/post_detail.js}"></script>
</body>

</html>
