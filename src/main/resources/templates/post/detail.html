<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>작업 상세</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body th:data-member-id="${post.memberId}"
      th:data-board-id="${post.boardId}"
      th:data-post-id="${post.id}"
      th:data-due-date="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}"
      th:data-current-member-id="${post.currentMemberId}">

<div th:replace="~{fragments/header :: back-header}"></div>

<div class="detail-wrap" th:with="palette=${post.boardColor}">
  <div th:replace="~{fragments/header :: board-breadcrumb(boardId=${post.boardId}, boardName=${post.boardName}, currentPage=${post.title})}"></div>

  <div class="toast" id="errorToast"
       th:text="${param.error == 'fileSize' ? '파일 크기는 10MB를 초과할 수 없습니다.' : (param.error == 'validation' ? '입력값이 올바르지 않습니다.' : (param.error != null ? '본인이 작성한 글만 삭제할 수 있습니다.' : ''))}">
  </div>

  <div class="post-card">
    <div class="post-header">
      <div class="post-meta-row">
        <span class="team-badge" th:classappend="${'badge-' + palette}">
          <span class="team-dot"></span>
          <span th:text="${post.boardName}">팀</span>
        </span>
        <span class="status-chip"
              th:classappend="'chip-' + ${#strings.toLowerCase(post.status)}"
              th:text="${post.status == 'PROGRESS' ? '진행 중' : (post.status == 'REQUESTED' ? '승인 요청' : (post.status == 'APPROVED' ? '완료' : '반려'))}"></span>
        <span class="due-chip" id="due-chip"
              th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
          <svg width="10" height="10"><use href="/img/icons.svg#icon-calendar"></use></svg>
          <span class="due-label"
                th:text="${post.dueDate != null ? #temporals.format(post.dueDate, 'MM.dd') : '기한 없음'}"></span>
        </span>
        <div class="assignee-chip-wrap" th:if="${post.postAssignees != null and !#lists.isEmpty(post.postAssignees)}">
          <button type="button" class="assignee-chip" id="btn-assignee-chip">
            <svg width="12" height="12"><use href="/img/icons.svg#icon-user"></use></svg>
            <span th:text="${#lists.size(post.postAssignees)}">0</span>
          </button>
          <div class="assignee-chip-dropdown" id="assignee-chip-dropdown">
            <div class="assignee-chip-item" th:each="assignee : ${post.postAssignees}" th:text="${assignee.username}">이름</div>
          </div>
        </div>
      </div>
      <div class="post-title" th:text="${post.title}">제목</div>
      <div class="post-info-row">
        <div class="post-info-item"><span id="writer-name" style="font-weight:500;">로딩 중...</span></div>
        <div class="post-info-item"><span
                th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')} + ' 등록'">등록일</span></div>
        <div class="post-info-item" th:if="${post.updatedAt != null}"><span
                th:text="${#temporals.format(post.updatedAt, 'yyyy.MM.dd HH:mm')} + ' 수정'">수정일</span></div>
      </div>
    </div>
    <div class="post-body">
      <div class="post-content" th:utext="${post.content}">내용</div>
    </div>

    <div class="post-files" th:if="${post.postFiles != null and !#lists.isEmpty(post.postFiles)}">
      <div class="post-files-label">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-upload"></use></svg>
        첨부파일
      </div>
      <div class="file-chip-list">
        <a class="file-chip" th:each="file : ${post.postFiles}"
           th:href="@{/files/{storedPath}(storedPath=${file.storedPath}, name=${file.originalName})}"
           th:text="${file.originalName}"
           target="_blank"></a>
      </div>
    </div>

    <div class="post-actions" th:if="${post.canModify}">
      <div class="post-actions-left">
        <button th:if="${post.canModify}" class="btn-delete" id="btn-delete">
          <svg width="13" height="13"><use href="/img/icons.svg#icon-trash"></use></svg> 삭제
        </button>
      </div>
      <div class="post-actions-right">
        <button th:if="${post.canModify}" class="btn-edit" id="btn-edit">수정</button>
        <form th:if="${post.canModify and (post.status == 'PROGRESS' or post.status == 'REJECTED')}" th:action="@{/board/{boardId}/post/request/{id}(boardId=${post.boardId},id=${post.id})}" method="post" style="margin:0;">
          <button type="submit" class="btn-request">✓ 완료 요청</button>
        </form>
        <form th:if="${post.canModify and post.status == 'REQUESTED'}"
              th:action="@{/board/{b}/manager/requests/approve/{id}(b=${post.boardId},id=${post.id})}"
              method="post" style="margin:0;">
          <input type="hidden" name="source" value="detail">
          <button type="submit" class="btn-approve">승인</button>
        </form>
        <button th:if="${post.canModify and (post.status == 'REQUESTED' or post.status == 'APPROVED')}"
                type="button" class="btn-reject"
                th:data-post-id="${post.id}">반려</button>
      </div>
    </div>
  </div>

  <!-- 반려 이력 사이드바 -->
  <div class="rejection-panel" th:if="${post.rejections != null and not #lists.isEmpty(post.rejections)}">
    <div class="rejection-panel-header">
      <span class="rejection-panel-title">반려 이력</span>
      <span class="rejection-panel-count" th:text="${#lists.size(post.rejections)} + '건'">0건</span>
    </div>
    <div class="rejection-list">
      <div class="rejection-item" th:each="rejection : ${post.rejections}"
           th:data-rejected-by="${rejection.rejectedBy}">
        <div class="rejection-date">
          <span class="rejection-rejector">로딩 중...</span>
          <span th:text="${#temporals.format(rejection.createdAt, 'MM.dd HH:mm')}">01.01</span>
        </div>
        <div class="rejection-reason" th:text="${rejection.reason}">반려 사유</div>
      </div>
    </div>
  </div>

  <div class="comment-section" id="comment-section">
    <div class="comment-header">
      <span class="comment-header-title">피드백 & 댓글</span>
      <span class="comment-count-badge" th:text="${#lists.size(post.commentList)} + '개'">0개</span>
    </div>
    <div class="comment-list">
      <div class="comment-empty" th:if="${#lists.isEmpty(post.commentList)}">댓글이 없습니다.</div>
      <div th:each="comment : ${post.commentList}"
           class="comment-item"
           th:classappend="${comment.depth == 1} ? 'comment-item--reply'"
           th:data-comment-id="${comment.id}">
        <div class="comment-top">
          <span class="comment-writer"
                th:classappend="${comment.authorRole == 'ADMIN'} ? 'comment-writer--admin' : (${comment.authorRole == 'MANAGER'} ? 'comment-writer--manager' : '')"
                th:text="${comment.authorUsername}">작성자</span>
          <span class="comment-deleted-badge" th:if="${comment.deleted and post.currentUserIsManagerOrAdmin}">삭제됨</span>
          <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}">01.01</span>
          <button type="button" class="btn-reply"
                  th:unless="${comment.deleted}"
                  th:data-comment-id="${comment.id}"
                  th:data-group-id="${comment.groupId != null ? comment.groupId : comment.id}"
                  th:data-author="${comment.authorUsername}">답글</button>
          <button type="button" class="btn-comment-edit"
                  th:if="${!comment.deleted and comment.memberId == post.currentMemberId}">수정</button>
          <form th:unless="${comment.deleted}"
                th:if="${comment.memberId == post.currentMemberId or post.currentUserIsManagerOrAdmin}"
                th:action="@{/board/{b}/post/{p}/comment/{c}/delete(b=${post.boardId},p=${post.id},c=${comment.id})}"
                method="post" class="comment-delete-form">
            <button type="submit" class="btn-comment-delete">삭제</button>
          </form>
        </div>
        <div class="comment-content"
             th:if="${!comment.deleted or post.currentUserIsManagerOrAdmin}"
             th:classappend="${comment.deleted} ? 'comment-content--deleted'"><span th:if="${comment.parentAuthorUsername != null}" class="comment-mention" th:text="'@' + ${comment.parentAuthorUsername}"></span><span th:text="${comment.content}">내용</span></div>
        <div class="comment-deleted-msg" th:if="${comment.deleted and !post.currentUserIsManagerOrAdmin}">삭제된 댓글입니다.</div>
      </div>
    </div>

    <div class="comment-form">
      <form th:action="@{/board/{boardId}/post/{postId}/comment(boardId=${post.boardId},postId=${post.id})}" method="post" id="commentForm">
        <input type="hidden" name="postId" th:value="${post.id}">
        <input type="hidden" name="parentId" id="commentParentId" value="">
        <input type="hidden" name="groupId" id="commentGroupId" value="">
        <input type="hidden" name="depth" id="commentDepth" value="0">
        <div class="comment-reply-target" id="commentReplyTarget"></div>
        <div class="comment-form-header">
          <span class="comment-form-author" id="commentAuthorName"></span>
          <span class="comment-char-count" id="commentCharCount">0/256</span>
        </div>
        <div class="comment-input-wrap">
          <textarea class="comment-textarea" name="content" placeholder="댓글을 입력하세요..." id="commentTextarea" rows="1" maxlength="256"></textarea>
          <div class="comment-input-footer">
            <button type="submit" class="btn-comment-submit">등록</button>
          </div>
        </div>
      </form>
    </div>
  </div>


<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title-row">
        <span class="modal-title">작업 수정</span>
        <span class="modal-team-badge" th:classappend="${'badge-' + palette}" th:text="${post.boardName}">팀</span>
      </div>
      <button type="button" class="modal-close" id="btn-edit-close">
        <svg width="10" height="10"><use href="/img/icons.svg#icon-close"></use></svg>
      </button>
    </div>
    <form id="edit-post-form" th:action="@{/board/{boardId}/post/update/{id}(boardId=${post.boardId},id=${post.id})}" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label class="form-label">제목</label>
        <input type="text" name="title" th:value="${post.title}" class="form-input" required />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <th:block th:replace="~{fragments/editor :: editor-form-group(${post.content})}"></th:block>
      </div>
      <div class="form-group">
        <label class="form-label">마감일 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
        <input type="hidden" name="dueDate" id="edit-due-value"
               th:value="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') + 'T00:00:00' : ''}">
        <div class="due-picker">
          <div class="due-picker-header">
            <span class="due-month-label" id="edit-month-label"></span>
            <div class="due-nav">
              <span class="due-selected-display" id="edit-selected-display">선택 안 함</span>
              <button type="button" class="due-nav-btn" id="btn-edit-prev-month">‹</button>
              <button type="button" class="due-nav-btn" id="btn-edit-next-month">›</button>
            </div>
          </div>
          <div class="due-grid">
            <div class="due-dow">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="due-days" id="edit-due-days"></div>
          </div>
          <button type="button" class="due-clear-btn" id="btn-edit-clear-due">선택 초기화</button>
        </div>
      </div>
      <div class="form-group" th:if="${post.postFiles != null and !#lists.isEmpty(post.postFiles)}">
        <label class="form-label">기존 첨부파일 <span style="color:var(--text-muted);font-weight:400;">(체크 시 삭제)</span></label>
        <div class="existing-file-list">
          <label class="existing-file-item" th:each="file : ${post.postFiles}">
            <input type="checkbox" name="deleteFileIds" th:value="${file.id}">
            <span class="file-name" th:text="${file.originalName}">파일명</span>
          </label>
        </div>
      </div>

      <div class="form-group" th:if="${post.boardUserList != null and !post.boardUserList.isEmpty()}">
        <label class="form-label">담당자 <span style="color:var(--text-muted);font-weight:400;">(선택)</span></label>
        <div class="selected-assignee-list" id="edit-selected-assignee-list">
          <span class="selected-assignee-chip"
                th:each="assignee : ${post.postAssignees}"
                th:data-member-id="${assignee.memberId}"
                th:data-username="${assignee.username}">
            <span class="assignee-chip-name" th:text="${assignee.username}"></span>
            <button type="button" class="selected-assignee-remove" th:data-member-id="${assignee.memberId}">×</button>
          </span>
        </div>
        <div class="assignee-picker" id="edit-assignee-picker">
          <button type="button" class="assignee-add-btn" id="btn-edit-add-assignee">
            <svg width="10" height="10"><use href="/img/icons.svg#icon-plus"></use></svg>
            담당자 추가
          </button>
          <div class="assignee-dropdown" id="edit-assignee-dropdown">
            <input type="text" class="assignee-search-input" id="edit-assignee-search"
                   placeholder="이름으로 검색" autocomplete="off">
            <div class="assignee-option-list" id="edit-assignee-option-list">
              <button type="button" class="assignee-option"
                      th:each="member : ${post.boardUserList}"
                      th:data-member-id="${member.memberId}"
                      th:data-username="${member.username}"
                      th:text="${member.username}">
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <input type="file" name="files" id="edit-file-input" multiple hidden>
        <button type="button" class="file-upload-btn" id="btn-edit-file-attach">
          <svg width="12" height="12"><use href="/img/icons.svg#icon-upload"></use></svg>
          파일 추가
        </button>
        <div class="file-chip-list" id="edit-file-chip-list"></div>
      </div>

      <button type="submit" class="btn-submit">수정 완료</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg width="20" height="20"><use href="/img/icons.svg#icon-trash-lg"></use></svg>
    </div>
    <div class="modal-title">정말 삭제하시겠습니까?</div>
    <div class="modal-desc">삭제된 데이터는 복구할 수 없습니다.</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btn-delete-cancel">취소</button>
      <form th:action="@{/board/{boardId}/post/delete/{id}(boardId=${post.boardId},id=${post.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn-modal-delete">삭제 승인</button>
      </form>
    </div>
  </div>
</div>

<div class="modal-overlay" id="rejectModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title-row">
        <span class="modal-title">반려 사유</span>
      </div>
      <button type="button" class="modal-close" id="btn-reject-close">
        <svg width="10" height="10"><use href="/img/icons.svg#icon-close"></use></svg>
      </button>
    </div>
    <form id="rejectForm" method="post">
      <input type="hidden" name="source" value="detail">
      <div class="form-group">
        <textarea name="reason" class="form-input" placeholder="반려 사유를 입력하세요" maxlength="300" required></textarea>
      </div>
      <button type="submit" class="btn-submit" style="background:#e11d48;">반려 확정</button>
    </form>
  </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/post_detail.js}"></script>
<script type="module" th:src="@{/js/post_editor.js}"></script>
</body>

</html>
