<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="manager-nav(boardId, activePage)" class="admin-nav">
  <a th:href="@{'/board/' + ${boardId} + '/manager/members'}"
     th:classappend="${activePage == 'members'} ? ' active'"
     class="admin-nav-item">멤버 관리</a>
  <a th:href="@{'/board/' + ${boardId} + '/manager/requests'}"
     th:classappend="${activePage == 'requests'} ? ' active'"
     class="admin-nav-item">승인 요청</a>
  <a th:href="@{'/board/' + ${boardId} + '/manager/settings'}"
     th:classappend="${activePage == 'settings'} ? ' active'"
     class="admin-nav-item">보드 설정</a>
</nav>

</html>
