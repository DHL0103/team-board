<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="board-header(board, isManager)">
  <div class="board-detail-header">
    <div class="board-title-row">
      <div class="page-title" th:text="${board.name}" th:style="|color: var(--${board.color}-color)|">보드명</div>
    </div>
    <div class="page-meta" id="boardDescription" style="white-space: pre-line;" th:text="${board.description}">설명</div>
    <div class="board-meta-row">
      <div class="board-member-count">
        <svg width="11" height="11"><use href="/img/icons.svg#icon-user"></use></svg>
        <span th:text="${board.memberCount} + '명'">0명</span>
      </div>
      <button type="button" class="btn-desc-toggle" id="btnDescToggle" style="display:none;">자세히 보기</button>
    </div>
    <div th:if="${isManager != null}" class="board-detail-header__action">
      <a th:if="${isManager}" th:href="@{'/boards/' + ${board.id} + '/manager/members'}" class="btn-edit">
        <svg width="14" height="14"><use href="/img/icons.svg#icon-settings"></use></svg>
        <span class="btn-label">매니저 페이지</span>
      </a>
      <button th:if="${board.member}" type="button" class="btn-edit" id="btn-leave-board">
        <svg width="14" height="14"><use href="/img/icons.svg#icon-logout"></use></svg>
        <span class="btn-label">보드 나가기</span>
      </button>
      <button class="btn-request" id="btn-create-post">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-plus"></use></svg>
        <span class="btn-label">작업 추가</span>
      </button>
    </div>
  </div>
  <div class="glow-line" th:classappend="${'glow-' + board.color}"></div>
</th:block>

</html>
