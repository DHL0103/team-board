<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="common-head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="_csrf_param" th:content="${_csrf.parameterName}">
  <link th:href="@{/css/lib/inter.css}" rel="stylesheet">
  <link th:href="@{/css/lib/bootstrap.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</th:block>

<header th:fragment="header(type)">
  <a th:href="${type == 'logo'} ? '/' : '/board'" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16"><use href="/img/icons.svg#icon-logo"></use></svg>
    </div>
    Team Board
  </a>
  <div class="header-right" th:if="${type != 'logo'}">
    <span class="nav-username" sec:authentication="name">username</span>
    <button class="hamburger" id="hamburger" type="button" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-menu" id="nav-menu">
      <a sec:authorize="hasRole('ADMIN')" href="/admin/members" class="btn-back">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-admin"></use></svg>
        관리자
      </a>
      <a href="/board/search" class="btn-back">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-search"></use></svg>
        보드 탐색
      </a>
      <a href="/member/mypage" class="btn-back">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-user"></use></svg>
        마이페이지
      </a>
      <a th:if="${type == 'back'}" href="/board" class="btn-back">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
        메인으로
      </a>
      <form th:if="${type == 'main'}" th:action="@{/member/logout}" method="post" style="margin:0;">
        <button type="submit" class="btn-back">
          <svg width="12" height="12"><use href="/img/icons.svg#icon-logout"></use></svg>
          로그아웃
        </button>
      </form>
    </div>
  </div>
</header>

</html>
