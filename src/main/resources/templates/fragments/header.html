<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="common-head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/lib/bootstrap.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</th:block>

<header th:fragment="logo-header">
  <a href="/" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16"><use href="/img/icons.svg#icon-logo"></use></svg>
    </div>
    Team Board
  </a>
</header>

<header th:fragment="back-header">
  <a href="/board" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16"><use href="/img/icons.svg#icon-logo"></use></svg>
    </div>
    Team Board
  </a>
  <div style="display:flex; align-items:center; gap:8px;">
    <a sec:authorize="hasRole('ADMIN')" href="/admin/members" class="btn-back">관리자</a>
    <a href="/board/search" class="btn-back">
      <svg width="12" height="12"><use href="/img/icons.svg#icon-search"></use></svg>
      보드 탐색
    </a>
    <a href="/member/mypage" class="btn-back">
      <svg width="12" height="12"><use href="/img/icons.svg#icon-user"></use></svg>
      마이페이지
    </a>
    <a href="/board" class="btn-back">
      <svg width="12" height="12"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
      메인으로
    </a>
  </div>
</header>

<nav th:fragment="admin-nav(activePage)" class="admin-nav">
  <a href="/admin/members" class="admin-nav-item" th:classappend="${activePage == 'members'} ? 'active'">멤버 관리</a>
  <a href="/admin/boards" class="admin-nav-item" th:classappend="${activePage == 'boards'} ? 'active'">보드 관리</a>
</nav>

<div th:fragment="board-breadcrumb(boardId, boardName, currentPage)" class="breadcrumb-row">
  <a href="/board">보드</a> <span class="breadcrumb-sep">›</span>
  <a th:href="@{'/board/' + ${boardId}}" th:text="${boardName}">보드명</a> <span class="breadcrumb-sep">›</span>
  <span th:text="${currentPage}">현재 페이지</span>
</div>

<header th:fragment="main-header">
  <a href="/board" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16"><use href="/img/icons.svg#icon-logo"></use></svg>
    </div>
    Team Board
  </a>
  <div style="display:flex; align-items:center; gap:8px;">
    <a sec:authorize="hasRole('ADMIN')" href="/admin/members" class="btn-back">관리자</a>
    <a href="/board/search" class="btn-back">
      <svg width="12" height="12"><use href="/img/icons.svg#icon-search"></use></svg>
      보드 탐색
    </a>
    <a href="/member/mypage" class="btn-back">
      <svg width="12" height="12"><use href="/img/icons.svg#icon-user"></use></svg>
      마이페이지
    </a>
    <form th:action="@{/member/logout}" method="post" style="margin:0;">
      <button type="submit" class="btn-back">로그아웃</button>
    </form>
  </div>
</header>

</html>
