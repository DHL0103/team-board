<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>회원가입 · Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: logo-header}"></div>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-header">
        <div class="login-title">팀 보드 회원가입</div>
        <div class="login-subtitle">사용할 계정 정보를 입력해 주세요</div>
      </div>

      <form th:action="@{/member/signup}" th:object="${signupRequestDto}" method="post">

        <div class="form-group">
          <label class="form-label" for="username">아이디</label>
          <input class="form-input" th:classappend="${#fields.hasErrors('username')} ? 'input-error'"
                 type="text" th:field="*{username}"
                 placeholder="영문, 숫자, 밑줄 포함 4~20자" autocomplete="username">
          <span class="input-error-msg visible" th:if="${#fields.hasErrors('username')}"
                th:errors="*{username}"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                 type="password" th:field="*{password}"
                 placeholder="4~20자" autocomplete="new-password">
          <span class="input-error-msg visible" th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
          <input class="form-input" th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'input-error'"
                 type="password" th:field="*{passwordConfirm}"
                 placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
          <span class="input-error-msg visible" th:if="${#fields.hasErrors('passwordConfirm')}"
                th:errors="*{passwordConfirm}"></span>
        </div>

        <button type="submit" class="btn-login">회원가입</button>
      </form>

      <hr class="divider">
      <div class="login-footer">
        이미 계정이 있으신가요? <a th:href="@{/member/login}">로그인</a>
      </div>

    </div>
  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/signup.js}"></script>

</body>

</html>
