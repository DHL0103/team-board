<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>멤버 관리</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <div class="toast" id="errorToast"
       th:text="${param.error != null and param.error[0] == 'last_manager' ? '마지막 매니저에게는 이 작업을 수행할 수 없습니다.' : ''}">
  </div>

  <div class="admin-wrap">
    <div th:replace="~{fragments/header :: board-breadcrumb(boardId=${board.id}, boardName=${board.name}, currentPage='매니저 페이지')}"></div>

    <div th:replace="~{fragments/manager-nav :: manager-nav(boardId=${board.id}, activePage='members')}"></div>

    <div class="admin-section">
      <div class="admin-section-header">
        <div>
          <div class="admin-section-title">유저 초대</div>
        </div>
      </div>
      <form th:action="@{'/board/' + ${board.id} + '/manager/members'}" method="get" class="invite-search-form">
        <input type="text" name="search" th:value="${search}" class="form-input" placeholder="아이디로 검색">
        <button type="submit" class="btn-admin-edit">검색</button>
      </form>
      <div th:if="${inviteResults != null}" class="invite-search-result">
        <div th:if="${#lists.isEmpty(inviteResults)}" class="invite-result-msg msg-error">검색 결과가 없습니다.</div>
        <div th:each="result : ${inviteResults}" class="invite-result-row">
          <span class="invite-result-username" th:text="${result.username}"></span>
          <div style="display:flex; align-items:center; gap:8px;">
            <span th:if="${result.boardRole == 'MANAGER'}" class="role-badge role-manager">Manager</span>
            <span th:if="${result.boardRole == 'USER'}" class="role-badge role-user">User</span>
            <span th:if="${result.boardRole == 'REQUESTED'}" class="role-badge role-requested">가입 요청 중</span>
            <span th:if="${result.boardRole == 'INVITED'}" class="role-badge role-invited">초대됨</span>
            <form th:if="${result.boardRole == null}" th:action="@{'/board/' + ${boardId} + '/manager/members/invite/' + ${result.memberId}}" method="post" style="margin:0;">
              <input type="hidden" name="search" th:value="${search}">
              <button type="submit" class="btn-invite-action">초대</button>
            </form>
            <button th:if="${result.boardRole != null and result.boardRole != 'INVITED'}" type="button" class="btn-invite-action btn-invite-action--disabled" disabled>초대</button>
          </div>
        </div>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-header">
        <div>
          <div class="admin-section-title">멤버 목록</div>
          <div class="admin-section-meta">보드에 속한 멤버와 가입 요청 현황입니다.</div>
        </div>
      </div>

      <div class="admin-empty" th:if="${#lists.isEmpty(memberList)}">
        등록된 멤버가 없습니다.
      </div>

      <table class="admin-table" th:unless="${#lists.isEmpty(memberList)}">
        <thead>
          <tr>
            <th>아이디</th>
            <th>보드 권한</th>
            <th></th>
          </tr>
        </thead>

        <!-- 매니저 그룹 -->
        <tbody th:with="managers=${memberList.?[boardRole == 'MANAGER']}">
          <tr class="table-group-label">
            <td colspan="3">매니저</td>
          </tr>
          <tr class="admin-table-row" th:each="member : ${managers}">
            <td th:text="${member.username}">username</td>
            <td><span class="role-badge role-manager">Manager</span></td>
            <td style="display:flex; gap:8px; align-items:center;">
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/demote/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-edit">멤버로 변경</button>
              </form>
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/remove/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-danger">내보내기</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(managers)}">
            <td colspan="3" style="color:var(--text-muted); font-size:13px; padding: 12px 16px;">없음</td>
          </tr>
        </tbody>

        <!-- 멤버 그룹 -->
        <tbody th:with="users=${memberList.?[boardRole == 'USER']}">
          <tr class="table-group-label">
            <td colspan="3">멤버</td>
          </tr>
          <tr class="admin-table-row" th:each="member : ${users}">
            <td th:text="${member.username}">username</td>
            <td><span class="role-badge role-user">User</span></td>
            <td style="display:flex; gap:8px; align-items:center;">
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/promote/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-edit">매니저로 변경</button>
              </form>
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/remove/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-danger">내보내기</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="3" style="color:var(--text-muted); font-size:13px; padding: 12px 16px;">없음</td>
          </tr>
        </tbody>

        <!-- 가입 요청 그룹 -->
        <tbody th:with="requested=${memberList.?[boardRole == 'REQUESTED']}">
          <tr class="table-group-label">
            <td colspan="3">가입 요청</td>
          </tr>
          <tr class="admin-table-row" th:each="member : ${requested}">
            <td th:text="${member.username}">username</td>
            <td><span class="role-badge role-requested">Requested</span></td>
            <td style="display:flex; gap:8px; align-items:center;">
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/approve/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-primary">승인</button>
              </form>
              <form th:action="@{'/board/' + ${board.id} + '/manager/members/remove/' + ${member.memberId}}" method="post" style="margin:0;">
                <button type="submit" class="btn-admin-danger">거절</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(requested)}">
            <td colspan="3" style="color:var(--text-muted); font-size:13px; padding: 12px 16px;">없음</td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/common/core.js}"></script>
  <script th:src="@{/js/common/ui.js}"></script>

</body>

</html>
