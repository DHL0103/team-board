<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${post.title} + ' · Team Board'">Post Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
        --bg:           #f5f5f4;
        --surface:      #ffffff;
        --border:       #e5e7eb;
        --border-soft:  #f0f0ef;
        --text:         #111827;
        --text-sub:     #6b7280;
        --text-muted:   #9ca3af;

        --backend-color:   #2563eb; --backend-bg: #eff6ff; --backend-border: #bfdbfe;
        --frontend-color:  #d97706; --frontend-bg: #fffbeb; --frontend-border: #fde68a;
        --design-color:    #7c3aed; --design-bg: #f5f3ff;  --design-border: #ddd6fe;

        --due-safe: #059669; --due-safe-bg: #ecfdf5;
        --due-warn: #d97706; --due-warn-bg: #fffbeb;
        --due-over: #dc2626; --due-over-bg: #fef2f2;

        --status-progress-color:  #2563eb; --status-progress-bg:  #eff6ff;
        --status-requested-color: #d97706; --status-requested-bg: #fffbeb;
        --status-completed-color: #059669; --status-completed-bg: #ecfdf5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        font-size: 14px;
    }

    /* ── Header ── */
    header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 32px;
        height: 56px;
        display: flex; align-items: center; justify-content: space-between;
        position: sticky; top: 0; z-index: 100;
    }
    .logo {
        display: flex; align-items: center; gap: 10px;
        font-weight: 600; font-size: 15px; color: var(--text);
        letter-spacing: -0.3px; text-decoration: none;
    }
    .logo-icon {
        width: 28px; height: 28px; background: var(--text);
        border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .btn-back {
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-sub); font-size: 13px; font-weight: 500;
        text-decoration: none; padding: 6px 12px;
        border: 1px solid var(--border); border-radius: 6px;
        transition: all 0.15s; background: var(--surface);
    }
    .btn-back:hover { border-color: #d1d5db; color: var(--text); }

    /* ── Layout ── */
    .detail-wrap {
        max-width: 800px;
        margin: 0 auto;
        padding: 36px 24px 60px;
    }

    /* ── Breadcrumb ── */
    .breadcrumb-row {
        display: flex; align-items: center; gap: 6px;
        font-size: 12px; color: var(--text-muted);
        margin-bottom: 20px;
    }
    .breadcrumb-row a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb-row a:hover { color: var(--text-sub); }
    .breadcrumb-sep { opacity: 0.4; }

    /* ── Post Card ── */
    .post-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 16px;
        animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* 팀 색상 상단 바 */
    .post-team-bar {
        height: 4px;
    }
    .team-backend  { background: var(--backend-color); }
    .team-frontend { background: var(--frontend-color); }
    .team-design   { background: var(--design-color); }

    .post-header {
        padding: 24px 28px 20px;
        border-bottom: 1px solid var(--border-soft);
    }

    .post-meta-row {
        display: flex; align-items: center; gap: 8px;
        flex-wrap: wrap; margin-bottom: 14px;
    }

    .team-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 600;
        padding: 3px 8px; border-radius: 4px;
    }
    .team-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-backend  { background: var(--backend-bg);  color: var(--backend-color);  border: 1px solid var(--backend-border); }
    .badge-backend  .team-dot { background: var(--backend-color); }
    .badge-frontend { background: var(--frontend-bg); color: var(--frontend-color); border: 1px solid var(--frontend-border); }
    .badge-frontend .team-dot { background: var(--frontend-color); }
    .badge-design   { background: var(--design-bg);   color: var(--design-color);   border: 1px solid var(--design-border); }
    .badge-design   .team-dot { background: var(--design-color); }

    .status-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600;
        padding: 3px 8px; border-radius: 4px;
    }
    .chip-progress  { background: var(--status-progress-bg);  color: var(--status-progress-color); }
    .chip-requested { background: var(--status-requested-bg); color: var(--status-requested-color); }
    .chip-completed { background: var(--status-completed-bg); color: var(--status-completed-color); }

    .due-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600;
        padding: 3px 8px; border-radius: 4px;
    }
    .due-chip svg { width: 10px; height: 10px; }
    .due-safe { background: var(--due-safe-bg); color: var(--due-safe); }
    .due-warn { background: var(--due-warn-bg); color: var(--due-warn); }
    .due-over { background: var(--due-over-bg); color: var(--due-over); }
    .due-none { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

    .post-title {
        font-size: 20px; font-weight: 700;
        letter-spacing: -0.4px; line-height: 1.4;
        color: var(--text); margin-bottom: 16px;
    }

    .post-info-row {
        display: flex; align-items: center; gap: 16px;
        font-size: 12px; color: var(--text-muted);
    }
    .post-info-item { display: flex; align-items: center; gap: 5px; }
    .avatar-sm {
        width: 20px; height: 20px; border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; color: white;
    }

    .post-body {
        padding: 24px 28px;
    }
    .post-content {
        font-size: 14px; color: var(--text);
        line-height: 1.75; white-space: pre-wrap;
        word-break: break-word;
    }

    /* 완료 요청 버튼 영역 */
    .post-actions {
        padding: 16px 28px;
        border-top: 1px solid var(--border-soft);
        display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-request {
        display: inline-flex; align-items: center; gap: 6px;
        background: #111827; color: white;
        border: none; padding: 8px 18px;
        border-radius: 6px; font-size: 13px; font-weight: 500;
        cursor: pointer; font-family: 'Inter', sans-serif;
        transition: background 0.15s, transform 0.15s;
        text-decoration: none;
    }
    .btn-request:hover { background: #374151; color: white; transform: translateY(-1px); }

    .btn-edit {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--surface); color: var(--text-sub);
        border: 1px solid var(--border); padding: 8px 18px;
        border-radius: 6px; font-size: 13px; font-weight: 500;
        cursor: pointer; font-family: 'Inter', sans-serif;
        transition: all 0.15s; text-decoration: none;
    }
    .btn-edit:hover { border-color: #d1d5db; color: var(--text); }

    /* ── Comments ── */
    .comment-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        animation: fadeUp 0.35s ease 0.08s both;
    }

    .comment-header {
        padding: 16px 28px;
        border-bottom: 1px solid var(--border-soft);
        display: flex; align-items: center; gap: 8px;
    }
    .comment-header-title {
        font-size: 13px; font-weight: 600; color: var(--text);
    }
    .comment-count-badge {
        font-size: 11px; font-weight: 500;
        background: var(--bg); color: var(--text-muted);
        padding: 1px 7px; border-radius: 20px;
        border: 1px solid var(--border);
    }

    .comment-list {
        padding: 0 28px;
    }

    /* 댓글 없을 때 */
    .comment-empty {
        padding: 32px 0;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
    }

    .comment-item {
        padding: 16px 0;
        border-bottom: 1px solid var(--border-soft);
        animation: fadeUp 0.3s ease both;
    }
    .comment-item:last-child { border-bottom: none; }

    .comment-top {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 8px;
    }
    .avatar-md {
        width: 28px; height: 28px; border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700; color: white;
        flex-shrink: 0;
    }
    .comment-writer {
        font-size: 13px; font-weight: 600; color: var(--text);
    }
    .comment-date {
        font-size: 11.5px; color: var(--text-muted); margin-left: auto;
    }
    .comment-content {
        font-size: 13.5px; color: var(--text);
        line-height: 1.6; padding-left: 36px;
        white-space: pre-wrap; word-break: break-word;
    }

    /* 댓글 입력 */
    .comment-form {
        padding: 16px 28px;
        border-top: 1px solid var(--border-soft);
        background: var(--bg);
    }
    .comment-input-row {
        display: flex; gap: 10px; align-items: flex-end;
    }
    .comment-textarea {
        flex: 1; resize: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: 'Inter', sans-serif;
        font-size: 13px; color: var(--text);
        background: var(--surface);
        outline: none;
        transition: border-color 0.15s;
        min-height: 42px; max-height: 120px;
        overflow-y: auto;
    }
    .comment-textarea:focus { border-color: #9ca3af; }
    .comment-textarea::placeholder { color: var(--text-muted); }

    .btn-comment-submit {
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--text); color: white;
        border: none; padding: 10px 18px;
        border-radius: 8px; font-size: 13px; font-weight: 500;
        cursor: pointer; font-family: 'Inter', sans-serif;
        white-space: nowrap;
        transition: background 0.15s;
    }
    .btn-comment-submit:hover { background: #374151; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <a href="/" class="logo" style="text-decoration:none; color:inherit;">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
        <rect x="1" y="1" width="6" height="6" rx="1"/>
        <rect x="9" y="1" width="6" height="6" rx="1"/>
        <rect x="1" y="9" width="6" height="6" rx="1"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg>
    </div>
    Team Board
  </a>
  <a href="/" class="btn-back">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    보드로 돌아가기
  </a>
</header>

<div class="detail-wrap">

  <!-- Breadcrumb -->
  <div class="breadcrumb-row">
    <a href="/">보드</a>
    <span class="breadcrumb-sep">›</span>
    <!-- boardId에 따라 팀 이름 표시 -->
    <span th:text="${post.boardId == 1 ? 'Backend팀' : post.boardId == 2 ? 'Frontend팀' : 'Design팀'}">팀</span>
    <span class="breadcrumb-sep">›</span>
    <span th:text="${post.title}">제목</span>
  </div>

  <!-- Post Card -->
  <div class="post-card">

    <!-- 팀 색상 바 -->
    <div class="post-team-bar"
         th:classappend="${post.boardId == 1 ? 'team-backend' : post.boardId == 2 ? 'team-frontend' : 'team-design'}">
    </div>

    <!-- 포스트 헤더 -->
    <div class="post-header">
      <div class="post-meta-row">
        <!-- 팀 배지 -->
        <span class="team-badge"
              th:classappend="${post.boardId == 1 ? 'badge-backend' : post.boardId == 2 ? 'badge-frontend' : 'badge-design'}">
                    <span class="team-dot"></span>
                    <span th:text="${post.boardId == 1 ? 'Backend팀' : post.boardId == 2 ? 'Frontend팀' : 'Design팀'}">팀</span>
                </span>

        <!-- 상태 칩 -->
        <span class="status-chip"
              th:classappend="${post.status == 'PROGRESS' ? 'chip-progress' : post.status == 'REQUESTED' ? 'chip-requested' : 'chip-completed'}"
              th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : '완료'}">
                </span>

        <!-- 마감일 칩 -->
        <span class="due-chip"
              id="due-chip"
              th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
                    <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
                        <rect x="1" y="1.5" width="8" height="7.5" rx="1"/>
                        <path d="M3 1v1M7 1v1M1 4h8"/>
                    </svg>
                    <span id="due-label"
                          th:text="${post.dueDate != null ? #temporals.format(post.dueDate, 'MM.dd') + ' 마감' : '기한 없음'}">
                    </span>
                </span>
      </div>

      <div class="post-title" th:text="${post.title}">제목</div>

      <div class="post-info-row">
        <div class="post-info-item">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="6" cy="4.5" r="2.5"/>
            <path d="M1.5 10.5c0-2 1.8-3.5 4.5-3.5s4.5 1.5 4.5 3.5"/>
          </svg>
          <span id="writer-name" style="font-weight:500;">로딩 중...</span>
        </div>
        <div class="post-info-item">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="6" cy="6" r="4.5"/>
            <path d="M6 3.5V6l1.5 1.5"/>
          </svg>
          <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')} + ' 등록'">등록일</span>
        </div>
        <div class="post-info-item" th:if="${post.updatedAt != null}">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M9.5 2.5 A5 5 0 1 1 2.5 6" stroke-linecap="round"/>
            <path d="M9.5 2.5V5H7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span th:text="${#temporals.format(post.updatedAt, 'MM.dd HH:mm')} + ' 수정'">수정일</span>
        </div>
      </div>
    </div>

    <!-- 본문 -->
    <div class="post-body">
      <div class="post-content" th:text="${post.content}">내용</div>
    </div>

    <!-- 액션 버튼 -->
    <div class="post-actions">
      <a th:href="'/post/' + ${post.id} + '/edit'" class="btn-edit">수정</a>
      <!-- PROGRESS일 때만 완료 요청 버튼 노출 -->
      <a th:if="${post.status == 'PROGRESS'}"
         th:href="'/post/' + ${post.id} + '/request'"
         class="btn-request">
        ✓ 완료 요청
      </a>
      <!-- REQUESTED 상태면 대기 중 표시 -->
      <span th:if="${post.status == 'REQUESTED'}"
            style="font-size:13px; color:var(--text-muted); align-self:center;">
                Admin 승인 대기 중...
            </span>
    </div>
  </div>

  <!-- Comment Section -->
  <div class="comment-section">
    <div class="comment-header">
      <span class="comment-header-title">피드백 & 댓글</span>
      <!-- commentList가 model에 없으면 0으로 표시, 있으면 실제 수 -->
      <span class="comment-count-badge"
            th:text="${commentList != null ? #lists.size(commentList) : 0} + '개'">0개</span>
    </div>

    <div class="comment-list">
      <!-- commentList가 없거나 비어있을 때 -->
      <div class="comment-empty"
           th:if="${commentList == null or #lists.isEmpty(commentList)}">
        아직 댓글이 없습니다. 첫 피드백을 남겨보세요.
      </div>

      <!-- commentList가 있을 때 반복 -->
      <div class="comment-item"
           th:each="comment : ${commentList}"
           th:if="${commentList != null}">
        <div class="comment-top">
          <div class="avatar-md"
               th:text="${comment.writerName != null ? #strings.substring(comment.writerName, 0, 1) : '#'}">U</div>
          <span class="comment-writer"
                th:text="${comment.writerName != null ? comment.writerName : '멤버 #' + comment.memberId}">작성자</span>
          <span class="comment-date"
                th:text="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}">01.01</span>
        </div>
        <div class="comment-content" th:text="${comment.content}">댓글 내용</div>
      </div>
    </div>

    <!-- 댓글 입력 폼 -->
    <div class="comment-form">
      <form th:action="'/post/' + ${post.id} + '/comment'" method="post">
        <div class="comment-input-row">
                    <textarea class="comment-textarea"
                              name="content"
                              placeholder="피드백이나 의견을 남겨주세요..."
                              rows="1"
                              id="commentTextarea"></textarea>
          <button type="submit" class="btn-comment-submit">등록</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ── 작성자 이름 fetch ──
  const memberId = [[${post.memberId}]];

  fetch(`/member/${memberId}`)
      .then(res => res.json())
      .then(member => {
          document.getElementById('writer-name').textContent = member.username;
      })
      .catch(() => {
          document.getElementById('writer-name').textContent = '알 수 없음';
      });

  // ── 마감일 칩 상태 ──
  const dueChip = document.getElementById('due-chip');
  const dueLabel = document.getElementById('due-label');
  const dueVal = dueChip?.dataset.due;

  if (dueVal) {
      const today = new Date(); today.setHours(0,0,0,0);
      const dueDate = new Date(dueVal);
      const diffDays = Math.floor((dueDate - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
          dueChip.classList.add('due-over');
          dueLabel.textContent = dueLabel.textContent + ' 초과';
      } else if (diffDays === 0) {
          dueChip.classList.add('due-warn');
          dueLabel.textContent = '오늘 마감';
      } else if (diffDays === 1) {
          dueChip.classList.add('due-warn');
          dueLabel.textContent = '내일 마감';
      } else if (diffDays <= 3) {
          dueChip.classList.add('due-warn');
      } else {
          dueChip.classList.add('due-safe');
      }
  } else {
      dueChip?.classList.add('due-none');
  }

  // ── textarea 높이 자동 조절 ──
  const textarea = document.getElementById('commentTextarea');
  textarea?.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  });
</script>

</body>
</html>
