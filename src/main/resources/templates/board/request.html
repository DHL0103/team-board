<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title th:text="${board.name}">보드</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <div class="board-grid-wrap">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; gap:16px; text-align:center;">
      <div class="board-grid-empty-icon">
        <svg width="24" height="24"><use href="/img/icons.svg#icon-alert"></use></svg>
      </div>
      <div>
        <div style="font-size:16px; font-weight:700; margin-bottom:8px;" th:text="${board.name}">보드명</div>
        <div style="font-size:13px; color:var(--text-muted);">이 보드에 접근 권한이 없습니다.</div>
      </div>
      <a href="/board" class="btn-edit" style="margin-top:8px;">
        <svg width="12" height="12"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
        보드 목록으로
      </a>
    </div>
  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/common.js}"></script>

</body>

</html>
