<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>보드 탐색 · Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <div class="search-wrap">

    <div class="search-header">
      <h2 class="search-title">보드 탐색</h2>
      <div class="search-input-wrap">
        <svg width="13" height="13"><use href="/img/icons.svg#icon-search"></use></svg>
        <input class="search-input" id="search-input" type="text" placeholder="보드 이름으로 검색" autocomplete="off">
      </div>
      <div class="search-filter-row">
        <div class="post-list-sort-group">
          <button class="post-list-sort-btn active" data-sort="recent">최근 생성 순</button>
          <button class="post-list-sort-btn" data-sort="members">참여자 순</button>
        </div>
        <select class="search-status-select" id="search-status-select">
          <option value="">전체</option>
          <option value="ACTIVE">활성</option>
          <option value="INACTIVE">비활성</option>
        </select>
      </div>
    </div>

    <div class="search-empty" id="search-empty" style="display:none;">
      검색 결과가 없습니다.
    </div>

    <div class="search-card-list" id="search-card-list"></div>

    <div class="search-pagination" id="searchPagination"></div>

  </div>

  <th:block th:replace="~{fragments/header :: common-scripts}"></th:block>
  <script th:src="@{/js/components/Pagination.js}"></script>
  <script th:src="@{/js/board/SearchPage.js}"></script>

</body>

</html>
