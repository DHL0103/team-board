<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>보드 탐색 · Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <div class="search-wrap">

    <div class="search-header">
      <h2 class="search-title">보드 탐색</h2>
      <form class="search-form-row" action="/board/search" method="get">
        <input class="search-input" type="text" name="keyword" th:value="${keyword}" placeholder="보드 이름으로 검색">
        <button type="submit" class="btn-search">
          <svg width="13" height="13"><use href="/img/icons.svg#icon-search"></use></svg>
          검색
        </button>
      </form>
    </div>

    <div class="search-empty" th:if="${#lists.isEmpty(boardList)}">
      검색 결과가 없습니다.
    </div>

    <div class="search-card-list" th:unless="${#lists.isEmpty(boardList)}">
      <div class="search-card" th:each="board : ${boardList}">

        <div class="search-card-left">
          <span class="search-board-dot" th:classappend="${'dot-' + board.color}"></span>
          <div class="search-card-info">
            <div class="search-board-name">
              <span th:text="${board.name}">보드명</span>
              <span th:if="${board.myRole == 'MANAGER' or board.myRole == 'USER'}"
                    class="role-badge"
                    th:classappend="${board.myRole == 'MANAGER'} ? 'role-manager' : 'role-user'"
                    th:text="${board.myRole == 'MANAGER'} ? '매니저' : '멤버'">역할</span>
            </div>
            <div class="search-board-desc" th:text="${board.description}">설명</div>
            <div class="search-board-meta">
              <svg width="11" height="11"><use href="/img/icons.svg#icon-user"></use></svg>
              <span th:text="${board.memberCount} + '명'">0명</span>
              <span th:if="${board.status == 'INACTIVE'}" class="status-badge status-inactive" style="margin-left:4px;">비활성</span>
            </div>
          </div>
        </div>

        <div class="search-card-right">
          <span th:if="${board.myRole == 'INVITED'}" class="role-badge role-invited">초대됨</span>
          <span th:if="${board.myRole == 'REQUESTED'}" class="role-badge role-requested">요청 중</span>
          <a th:href="@{'/board/' + ${board.id}}" class="btn-board-go">보드로 이동</a>
        </div>
      </div>
    </div>

    <div class="search-pagination" id="searchPagination"></div>

  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/board-search.js}"></script>

</body>

</html>
