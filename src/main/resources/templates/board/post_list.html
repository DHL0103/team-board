<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title th:text="${board.name} + ' · ' + ${status == 'PROGRESS' ? '진행 중' : status == 'REQUESTED' ? '승인 요청' : status == 'APPROVED' ? '완료' : status}">포스트 목록</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body th:data-board-id="${board.id}"
      th:data-status="${status}"
      th:data-my-post-ids="${myPostIds}">

  <div th:replace="~{fragments/header :: back-header}"></div>

  <th:block th:replace="~{fragments/board-header :: board-header(${board}, null)}"></th:block>

  <div class="post-list-page">
    <div class="post-list-wrap">

      <div class="post-list-header">
        <span class="status-chip"
              th:classappend="${status == 'PROGRESS' ? 'chip-progress' : status == 'REQUESTED' ? 'chip-requested' : 'chip-completed'}"
              th:text="${status == 'PROGRESS' ? '진행 중' : status == 'REQUESTED' ? '승인 요청' : status == 'APPROVED' ? '완료' : status}">진행 중</span>
        <span class="col-count" id="postListCount">-</span>
        <div class="post-list-search-wrap">
          <svg width="13" height="13"><use href="/img/icons.svg#icon-search"></use></svg>
          <input type="text" class="post-list-search-input" id="postListSearchInput" placeholder="제목 검색...">
        </div>
        <a class="btn-edit post-list-back" th:href="@{'/board/' + ${board.id}}">
          <svg width="12" height="12"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
          칸반으로
        </a>
        <div class="post-list-controls">
          <div class="post-list-sort-group">
            <button type="button" class="post-list-sort-btn active" data-sort="newest">최신순</button>
            <button type="button" class="post-list-sort-btn" data-sort="oldest">오래된순</button>
            <button type="button" class="post-list-sort-btn" data-sort="due">마감순</button>
          </div>
          <button type="button" class="post-list-mine-btn" id="btn-mine-filter">
            <svg width="11" height="11"><use href="/img/icons.svg#icon-user"></use></svg>
            내 담당
          </button>
        </div>
      </div>

      <div class="post-list-empty" id="post-list-empty" style="display:none">
        <div class="board-grid-empty-icon">
          <svg width="24" height="24"><use href="/img/icons.svg#icon-alert"></use></svg>
        </div>
        <div>작업이 없습니다.</div>
      </div>

      <div class="post-list-body" id="post-list-body"></div>

      <div class="pagination-wrap" id="post-list-pagination"></div>

    </div>

  </div>

  <th:block th:replace="~{fragments/header :: common-scripts}"></th:block>
  <script th:src="@{/js/components/Pagination.js}"></script>
  <script th:src="@{/js/board/PostListPage.js}"></script>

</body>

</html>
