<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title th:text="${board.name} + ' · ' + ${status == 'PROGRESS' ? '진행 중' : status == 'REQUESTED' ? '승인 요청' : status == 'APPROVED' ? '완료' : status}">포스트 목록</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: back-header}"></div>

  <th:block th:replace="~{fragments/board-header :: board-header(${board}, null)}"></th:block>

  <div class="post-list-page">
    <div class="post-list-wrap">

      <div class="post-list-header">
        <span class="status-chip"
              th:classappend="${status == 'PROGRESS' ? 'chip-progress' : status == 'REQUESTED' ? 'chip-requested' : 'chip-completed'}"
              th:text="${status == 'PROGRESS' ? '진행 중' : status == 'REQUESTED' ? '승인 요청' : status == 'APPROVED' ? '완료' : status}">진행 중</span>
        <span class="col-count" id="postListCount" th:text="${#lists.size(postList)} + '건'">0건</span>
        <div class="post-list-search-wrap">
          <svg width="13" height="13"><use href="/img/icons.svg#icon-search"></use></svg>
          <input type="text" class="post-list-search-input" id="postListSearchInput" placeholder="제목 검색...">
        </div>
        <div class="post-list-sort-group">
          <button type="button" class="post-list-sort-btn active" data-sort="newest">최신순</button>
          <button type="button" class="post-list-sort-btn" data-sort="oldest">오래된순</button>
          <button type="button" class="post-list-sort-btn" data-sort="due">마감순</button>
        </div>
        <a class="btn-edit post-list-back" th:href="@{'/board/' + ${board.id}}">
          <svg width="12" height="12"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
          칸반으로
        </a>
      </div>

      <div class="post-list-empty" th:if="${#lists.isEmpty(postList)}">
        <div class="board-grid-empty-icon">
          <svg width="24" height="24"><use href="/img/icons.svg#icon-alert"></use></svg>
        </div>
        <div th:text="'해당하는 ' + ${status == 'PROGRESS' ? '진행 중' : status == 'REQUESTED' ? '승인 요청' : status == 'APPROVED' ? '완료' : status} + ' 작업이 없습니다.'">작업이 없습니다.</div>
      </div>

      <div class="post-list-body" th:unless="${#lists.isEmpty(postList)}">
        <a class="post-list-card"
           th:each="post : ${postList}"
           th:href="@{'/board/' + ${board.id} + '/post/' + ${post.id}}"
           th:data-created-at="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm:ss')}"
           th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
          <div class="card-top">
            <div class="card-title" th:text="${post.title}">제목</div>
            <span class="status-chip"
                  th:classappend="${post.status == 'PROGRESS' ? 'chip-progress' : post.status == 'REQUESTED' ? 'chip-requested' : post.status == 'REJECTED' ? 'chip-rejected' : post.status == 'APPROVED' ? 'chip-completed' : ''}"
                  th:text="${post.status == 'PROGRESS' ? '진행 중' : post.status == 'REQUESTED' ? '승인 요청' : post.status == 'REJECTED' ? '반려' : post.status == 'APPROVED' ? '완료' : post.status}"></span>
          </div>
          <div class="card-content" th:text="${post.plainContent}">내용</div>
          <div class="card-footer">
            <div class="card-left">
              <span class="due-chip"
                    th:data-due="${post.dueDate != null ? #temporals.format(post.dueDate, 'yyyy-MM-dd') : ''}">
                <svg width="10" height="10"><use href="/img/icons.svg#icon-calendar"></use></svg>
                <span class="due-label"
                      th:text="${post.dueDate != null ? #temporals.format(post.dueDate, 'MM.dd') : '기한 없음'}"></span>
              </span>
            </div>
            <div class="card-right">
              <svg th:if="${myPostIds.contains(post.id)}" class="card-mine-icon" width="12" height="12"><use href="/img/icons.svg#icon-user"></use></svg>
              <span class="card-date" th:text="${#temporals.format(post.createdAt, 'MM.dd')}"></span>
            </div>
          </div>
        </a>
      </div>

      <div class="pagination-wrap" id="post-list-pagination"></div>

    </div>

  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/board_post_list.js}"></script>

</body>

</html>
