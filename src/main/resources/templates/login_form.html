<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · Team Board</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
        --bg:          #f5f5f4;
        --surface:     #ffffff;
        --border:      #e5e7eb;
        --border-soft: #f0f0ef;
        --text:        #111827;
        --text-sub:    #6b7280;
        --text-muted:  #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ── Header ── */
    header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 32px;
        height: 56px;
        display: flex;
        align-items: center;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
        letter-spacing: -0.3px;
        text-decoration: none;
    }

    .logo-icon {
        width: 28px; height: 28px;
        background: var(--text);
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
    }

    /* ── Center layout ── */
    .login-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
    }

    .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px 40px 36px;
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .login-header {
        margin-bottom: 28px;
    }

    .login-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: var(--text);
        margin-bottom: 6px;
    }

    .login-subtitle {
        font-size: 13px;
        color: var(--text-muted);
    }

    /* ── Form ── */
    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 6px;
    }

    .form-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
        border-color: #6b7280;
        box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
    }

    .form-input::placeholder {
        color: var(--text-muted);
    }

    /* 에러 메시지 */
    .error-msg {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        color: #dc2626;
        margin-bottom: 16px;
    }
    .error-msg svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* 로그인 버튼 */
    .btn-login {
        width: 100%;
        background: var(--text);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s;
        margin-top: 8px;
        letter-spacing: -0.2px;
    }
    .btn-login:hover {
        background: #374151;
        transform: translateY(-1px);
    }
    .btn-login:active {
        transform: translateY(0);
    }

    .divider {
        border: none;
        border-top: 1px solid var(--border-soft);
        margin: 24px 0 0;
    }

    .login-footer {
        padding-top: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
        <rect x="1" y="1" width="6" height="6" rx="1"/>
        <rect x="9" y="1" width="6" height="6" rx="1"/>
        <rect x="1" y="9" width="6" height="6" rx="1"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg>
    </div>
    Team Board
  </a>
</header>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-header">
      <div class="login-title">팀 보드에 로그인</div>
      <div class="login-subtitle">계정 정보를 입력해 주세요</div>
    </div>

    <div class="error-msg" th:if="${param.error != null}">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="7" r="6"/>
        <path d="M7 4v3M7 9.5v.5" stroke-linecap="round"/>
      </svg>
      <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
    </div>

    <form th:action="@{/member/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

      <div class="form-group">
        <label class="form-label" for="username">아이디</label>
        <input class="form-input"
               type="text"
               id="username"
               name="username"
               placeholder="아이디를 입력하세요"
               autocomplete="username"
               required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input"
               type="password"
               id="password"
               name="password"
               placeholder="비밀번호를 입력하세요"
               autocomplete="current-password"
               required>
      </div>

      <button type="submit" class="btn-login">로그인</button>
    </form>

    <hr class="divider">
    <div class="login-footer">
      계정 문의는 관리자에게 연락해 주세요
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 엔터 키로 폼 제출
  document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
              e.preventDefault(); // 기본 엔터 동작 방지
              document.querySelector('form').submit(); // 폼 바로 제출
          }
      });
  });
</script>

</body>
</html>
