<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>로그인 · Team Board</title>
  <th:block th:replace="~{fragments/header :: common-head}"></th:block>
</head>

<body>

  <div th:replace="~{fragments/header :: header('logo')}"></div>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-header">
        <div class="login-title">팀 보드에 로그인</div>
        <div class="login-subtitle">계정 정보를 입력해 주세요</div>
      </div>

      <div class="error-msg" th:if="${param.error != null and param.error[0] == 'suspended'}">
        <svg width="14" height="14"><use href="/img/icons.svg#icon-alert"></use></svg>
        <span>계정이 정지된 상태입니다. 관리자에게 문의하세요.</span>
      </div>
      <div class="error-msg" th:if="${param.error != null and param.error[0] == 'true'}">
        <svg width="14" height="14"><use href="/img/icons.svg#icon-alert"></use></svg>
        <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
      </div>

      <div class="success-msg" th:if="${param.registered != null}">
        <span>회원가입이 완료됐습니다. 로그인해 주세요.</span>
      </div>
      <div class="success-msg" th:if="${param.passwordChanged != null}">
        <span>비밀번호가 변경됐습니다. 다시 로그인해 주세요.</span>
      </div>

      <form th:action="@{/members/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />

        <div class="form-group">
          <label class="form-label" for="username">아이디</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="아이디를 입력하세요"
            autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"
            autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>

      <hr class="divider">
      <div class="login-footer">
        계정이 없으신가요? <a th:href="@{/members/signup}">회원가입</a>
      </div>

    </div>
  </div>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>

</body>

</html>
