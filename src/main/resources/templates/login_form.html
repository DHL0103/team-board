<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · Team Board</title>

  <link th:href="@{/css/lib/bootstrap.min.css}" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

  <header>
    <a href="/" class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
          <rect x="1" y="1" width="6" height="6" rx="1" />
          <rect x="9" y="1" width="6" height="6" rx="1" />
          <rect x="1" y="9" width="6" height="6" rx="1" />
          <rect x="9" y="9" width="6" height="6" rx="1" />
        </svg>
      </div>
      Team Board
    </a>
  </header>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-header">
        <div class="login-title">팀 보드에 로그인</div>
        <div class="login-subtitle">계정 정보를 입력해 주세요</div>
      </div>

      <div class="error-msg" th:if="${param.error != null}">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="6" />
          <path d="M7 4v3M7 9.5v.5" stroke-linecap="round" />
        </svg>
        <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
      </div>

      <form th:action="@{/member/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />

        <div class="form-group">
          <label class="form-label" for="username">아이디</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="아이디를 입력하세요"
            autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"
            autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>

      <hr class="divider">
      <div class="login-footer">
        계정 문의는 관리자에게 연락해 주세요
      </div>

    </div>
  </div>

  <script src="/js/lib/bootstrap.bundle.min.js"></script>

  <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>

</body>

</html>
