spring:
  profiles:
    active: "dev"
---

spring:
  config:
    activate:
      on-profile: "dev"
  application:
    name: spring-boot-tutorial-v2

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
    enabled: true
    encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  configuration:
    jdbc-type-for-null: "NULL"
    map-underscore-to-camel-case: true
  type-aliases-package: kr.co.promptech.springboottutorial.model
  mapper-locations: mapper/**/*Mapper.xml

server:
  port: 8080